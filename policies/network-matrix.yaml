# Connection matrix of the Organisation Wallet Suite: the one source of the
# network policy rules of the Helm chart (templates/networkpolicy/). The
# chart templates read this file. It is deployment data, not a service
# contract.
#
# Labels on every pod of the suite:
#   netpol.igrant.io/role: <role>              one of "roles"
#   netpol.igrant.io/egress-<profile>: "true"  one per external profile
#
# A new connection needs a change of this file on purpose (least privilege).

# Roles and their named container ports (the numbers are the chart defaults;
# the gateway port is gateway.listenPort).
roles:
  gateway: {ports: {http: 8070}}
  api: {ports: {http: 80}}
  webhook: {ports: {http: 80}}            # probes only: no caller
  consent: {ports: {http: 80, admin: 8081}}   # admin: probes only
  wallet-service: {ports: {http: 8080}}
  wallet-config: {ports: {http: 8080}}
  wallet-worker: {ports: {health: 9191}}   # /healthz, /readyz, /metrics: probes and the scrape only
  wallet-clock: {ports: {health: 9192}}    # /healthz, /readyz, /metrics: probes and the scrape only
  wallet-scheduler: {ports: {}}
  dashboard: {ports: {http: 80}}
  db: {ports: {database: 5432}}          # the port of database.engine (5432)
  nats: {ports: {client: 4222, cluster: 6222, monitor: 8222}}
  openbao: {ports: {https: 8200, cluster: 8201}}   # the bundled OpenBao (openbao.mode bundled)
  redis: {ports: {redis: 6379, sentinel: 26379}}   # the bundled Valkey (redis.mode bundled): a data server and a Sentinel in each pod
  job: {ports: {}}                        # every Job and hook

# Sources outside the roles: their selectors are platform values
# (networkPolicy.ingressController, networkPolicy.monitoring).
externalSources: [ingressController, monitoring]

# Allowed in-cluster connections: <from> may open <to>:<port>. The chart
# renders one ingress policy per destination role and one egress policy per
# source role from this list.
connections:
  - {to: gateway, port: http, from: [ingressController]}
  - {to: wallet-service, port: http, from: [ingressController]}
  - {to: dashboard, port: http, from: [ingressController]}
  - {to: api, port: http, from: [gateway]}
  - {to: consent, port: http, from: [gateway]}
  - {to: wallet-config, port: http, from: [gateway]}
  # the own databases and the read-only reader connections across the services
  - {to: db, port: database, from: [gateway, api, webhook, consent, wallet-service, wallet-config, wallet-worker, wallet-clock, wallet-scheduler, job]}
  # the clock connects to no NATS
  - {to: nats, port: client, from: [api, webhook, consent, wallet-service, wallet-config, wallet-worker, wallet-scheduler, job]}
  - {to: nats, port: cluster, from: [nats]}
  - {to: nats, port: monitor, from: [monitoring]}
  # the chart OpenBao (wallet KMS): the wallet roles; the raft peers (join and
  # request forwarding on https, raft and cluster traffic on cluster)
  - {to: openbao, port: https, from: [wallet-service, wallet-config, wallet-worker, wallet-scheduler, openbao]}
  - {to: openbao, port: cluster, from: [openbao]}
  # Valkey: the wallet roles and the gateway (the primary and the Sentinels
  # that give it); the other Valkey pods (the replication, the Sentinels on
  # the data servers and on each other, the start and stop scripts)
  - {to: redis, port: redis, from: [gateway, wallet-service, wallet-config, wallet-worker, wallet-clock, wallet-scheduler, redis]}
  - {to: redis, port: sentinel, from: [gateway, wallet-service, wallet-config, wallet-worker, wallet-clock, wallet-scheduler, redis]}
  # the metrics of the workers and of the clock (the ServiceMonitor)
  - {to: wallet-worker, port: health, from: [monitoring]}
  - {to: wallet-clock, port: health, from: [monitoring]}

# Connections that must be denied (the check proves it).
forbidden:
  - {from: ingressController, to: [api, webhook, consent, wallet-config, wallet-worker, wallet-clock, wallet-scheduler, db, nats, openbao, redis]}
  - {from: gateway, to: [webhook, wallet-service, wallet-worker, wallet-clock, nats, openbao]}
  - {from: api, to: [consent, wallet-config, wallet-service, wallet-worker, wallet-clock, webhook, gateway, openbao, redis]}
  - {from: webhook, to: [api, consent, wallet-config, wallet-service, wallet-worker, wallet-clock, gateway, openbao, redis]}
  - {from: consent, to: [api, wallet-config, wallet-service, wallet-worker, wallet-clock, webhook, gateway, openbao, redis]}
  - {from: wallet-service, to: [api, consent, wallet-config, wallet-worker, wallet-clock, webhook, gateway]}
  - {from: wallet-config, to: [api, consent, wallet-service, wallet-worker, wallet-clock, webhook, gateway]}
  - {from: wallet-worker, to: [api, consent, wallet-config, wallet-service, wallet-clock, webhook, gateway, dashboard]}
  - {from: wallet-clock, to: [api, consent, wallet-config, wallet-service, wallet-worker, webhook, gateway, dashboard, nats, openbao]}
  - {from: wallet-scheduler, to: [api, consent, wallet-config, wallet-service, wallet-worker, wallet-clock, webhook, gateway]}
  - {from: dashboard, to: [gateway, api, webhook, consent, wallet-service, wallet-config, wallet-worker, wallet-clock, db, nats, openbao, redis]}
  - {from: job, to: [gateway, api, webhook, consent, wallet-service, wallet-config, wallet-worker, wallet-clock, dashboard, openbao, redis]}
  - {from: openbao, to: [gateway, api, webhook, consent, wallet-service, wallet-config, wallet-worker, wallet-clock, wallet-scheduler, dashboard, db, nats, redis]}
  - {from: redis, to: [gateway, api, webhook, consent, wallet-service, wallet-config, wallet-worker, wallet-clock, wallet-scheduler, dashboard, db, nats, openbao]}

# External egress profiles and the roles that may use them. The targets
# (CIDRs or namespace/pod selectors) and the default profiles of each role
# are values of the deployment (chart: networkPolicy.egress).
profiles:
  internet: {roles: [api, webhook, gateway, consent, wallet-service, wallet-config, wallet-worker, wallet-scheduler, job]}
  internet-any-port: {roles: [api, webhook]}
  metadata: {roles: [api, webhook, wallet-service, wallet-config, wallet-worker, wallet-scheduler, job]}
  kms: {roles: [wallet-service, wallet-config, wallet-worker, wallet-scheduler, job]}
  cloudKms: {roles: [wallet-service, wallet-config, wallet-worker, wallet-scheduler]}   # a private endpoint of a cloud KMS (the key store types gcp-kms, aws-kms, azure-key-vault)
  auditBucket: {roles: [wallet-worker]}   # the S3 store of the audit bucket on a private address (organisationWallet.audit.bucket, type s3)
  smtp: {roles: [api]}
  kubeApi: {roles: [api]}
