# The values file of install step 7 of the earlier releases: the first
# admin, the organisation type and the organisation, without the platform
# operator mark. It must render as before (tests/check_operator_jobs.py old).
api:
  jobs:
    createOrganisationType:
      enabled: true
      type: Technology
    registerAdmin:
      enabled: true
      email: admin@example.org
      name: First Admin
      phone: "+4612345678"
      passwordSecret: first-admin
    createOrganisation:
      enabled: true
      name: Example Organisation
      location: Stockholm
      policyUrl: https://example.org/privacy
