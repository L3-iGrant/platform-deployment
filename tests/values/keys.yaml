# Test key values. No secrets: key ids, empty public JWKS, test public nkeys
# and Secret names. In a real installation, scripts/make-keys.sh writes this
# file.
keys:
  apiTokenSigning:
    activeKid: test-token-kid
  gatewayInternalToken:
    activeKid: test-gateway-kid
  serviceEnvelope:
    api:
      activeKid: test-api-envelope-kid
      publicJwks: '{"keys":[]}'
    organisationWallet:
      activeKid: test-wallet-envelope-kid
      publicJwks: '{"keys":[]}'
  publicJwks:
    gatewayInternalToken: '{"keys":[]}'
    apiTokenVerification: '{"keys":[]}'
nats:
  users:
    api: {nkey: UTESTAPI, seed: {existingSecret: t-nats-api}}
    webhook: {nkey: UTESTAPIWEBHOOK, seed: {existingSecret: t-nats-api-webhook}}
    walletConfig: {nkey: UTESTWALLETCONFIG, seed: {existingSecret: t-nats-wallet-config}}
    walletService: {nkey: UTESTWALLETSERVICE, seed: {existingSecret: t-nats-wallet-service}}
    walletWorker: {nkey: UTESTWALLETWORKER, seed: {existingSecret: t-nats-wallet-worker}}
