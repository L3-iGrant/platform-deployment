# A new installation that creates the platform operator organisation and its
# first platform admin (case "bootstrap" of tests/check_operator_jobs.py).
api:
  jobs:
    provisionPlatformOperator:
      enabled: true
      organisation:
        name: Example Wallet Provider
        type: Technology
        location: Stockholm
        policyUrl: https://example.org/privacy
      firstAdmin:
        email: admin@example.org
        name: First Admin
        password: {existingSecret: platform-admin, key: first-password}
