# A new installation that creates the platform operator organisation and its
# first platform admin (case "bootstrap" of tests/check_operator_jobs.py).
api:
  jobs:
    bootstrapPlatform:
      enabled: true
      adminEmail: admin@example.org
      adminName: First Admin
      passwordSecret: platform-admin
      passwordKey: first-password
      organisationName: Example Wallet Provider
      type: Technology
      location: Stockholm
      policyUrl: https://example.org/privacy
