# Broken security settings for tests/render-matrix.sh. These values break
# the Pod Security Standard "restricted" in fields that an earlier version of
# the check missed. Both security checks (tests/check_security.py and
# tests/psscheck) must refuse the render. Never use these values.
api:
  containerSecurityContext:
    appArmorProfile:
      type: Unconfined
    seLinuxOptions:
      type: spc_t
    procMount: Unmasked
organisationWallet:
  podSecurityContext:
    windowsOptions:
      hostProcess: true
