# The services of the iGrant.io platform for Docker Compose (README.md).
#
# Do not start this file directly: docker-compose.yaml loads it with the
# values of .env and of config/engine/<DB_ENGINE>.env (DB_PORT,
# DB_ADMIN_USER, DB_CLIENT_IMAGE) and of generated/configs.env. The
# configuration files of the components are the "configs" at the end of
# this file: files of generated/, which make configs writes from the
# templates of compose.configs.yaml with the values of .env. The secrets
# come from secrets/ (make secrets makes them; git ignores the folder and
# generated/). Each service that reads a file of generated/ has the label
# io.igrant.config-sha256.<config> with the SHA-256 of that file (from
# generated/configs.env): when the file changes, "docker compose up" starts
# the service again, as it does for a changed image or setting.
#
# Only the public services have a host port: the auth gateway (the API),
# the public wallet routes and the dashboard. Your reverse proxy with TLS
# sends the traffic of your public host names to these ports. The other
# services are only on the Compose network.

x-server: &server
  restart: unless-stopped
  # The Go servers drain for 1 s, then wait at most 20 s for the open
  # requests (Server.drainSeconds, Server.gracefulShutdownSeconds).
  stop_grace_period: 30s

# The security settings of the services (README.md, "Security settings"):
# a read-only root file system, no Linux capability, and no new privileges
# (setuid and setgid programs do not give more rights). Each service also
# has its non-root user (user: UID:GID) and tmpfs or volumes for the paths
# that it writes. Only the one-shot services that change the owner of
# files in a volume (nats-data-owner) run as root, with only the
# capabilities that they need and no network. tests/compose-files.sh
# checks each service.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

x-wallet: &wallet
  image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY in .env}/eudi-wallet:${PLATFORM_TAG:?set PLATFORM_TAG in .env}
  # The full command of the server (config and service): the image has no
  # shell and no entrypoint script. The worker and the clock give their own.
  command: ["/app/.venv/bin/start-server"]
  restart: unless-stopped
  # The security settings, and the user ows of the image. The processes
  # write only to /tmp (the temporary files of Python, for example a part of
  # a multipart form that is larger than 1 MB).
  <<: *hardened
  user: "65532:65532"
  tmpfs:
    - /tmp:size=64m
  # The wallet waits at most 20 s for open requests and 10 s for background
  # tasks (its defaults).
  stop_grace_period: 40s

x-job: &job
  restart: "no"

services:
  # --- Database: one server of DB_ENGINE for all components ------------------
  # COMPOSE_PROFILES (.env) selects the server: the profile of DB_ENGINE
  # (postgresql). The server has the network alias "database", the host of
  # all database configurations.

  postgres:
    <<: *hardened
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE in .env}
    profiles: [postgresql]
    # The user postgres of the image. It owns the data folder (the image
    # gives the volume to it when Docker makes the volume).
    user: "999:999"
    # The server logs each DDL statement (log_statement=ddl: CREATE, ALTER,
    # DROP, GRANT, REVOKE and the role statements) and each connection and
    # disconnection to the container log (docker compose logs postgres).
    command: ["postgres", "-c", "max_connections=200", "-c", "password_encryption=scram-sha-256",
              "-c", "log_statement=ddl", "-c", "log_connections=on", "-c", "log_disconnections=on"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/database/admin-password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    secrets:
      - source: database-admin-password
        target: /run/secrets/database/admin-password
    volumes:
      # PostgreSQL 18 images keep the data in /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    # The socket and the lock file of the server, and the temporary files of
    # the entrypoint of the image.
    tmpfs:
      - /var/run/postgresql:size=1m,uid=999,gid=999,mode=0775
      - /tmp:size=64m
    networks:
      default:
        aliases: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Makes the databases igrant_api, igrant_oidc, igrant_consent and
  # igrant_wallet and their owner users (the user name is the database
  # name), then stops. Idempotent: it sets the passwords each time. The data
  # scopes of the wallet are schemas in igrant_wallet, which
  # wallet-database-roles makes; no process of the wallet logs in as the
  # owner user igrant_wallet.
  database-init:
    <<: [*job, *hardened]
    image: ${DB_CLIENT_IMAGE:?DB_ENGINE must be postgresql}
    user: "999:999"
    entrypoint: ["bash", "/scripts/create-databases.sh"]
    tmpfs:
      - /tmp:size=16m
    environment:
      DB_ENGINE: ${DB_ENGINE}
      DB_PORT: ${DB_PORT}
      DB_ADMIN_USER: ${DB_ADMIN_USER}
    configs:
      - source: database-init-script
        target: /scripts/create-databases.sh
    secrets:
      - {source: database-admin-password, target: /run/secrets/database/admin-password}
      - {source: db-igrant-api-password, target: /run/secrets/database/igrant_api-password}
      - {source: db-igrant-oidc-password, target: /run/secrets/database/igrant_oidc-password}
      - {source: db-igrant-consent-password, target: /run/secrets/database/igrant_consent-password}
      - {source: db-igrant-wallet-password, target: /run/secrets/database/igrant_wallet-password}
    depends_on:
      postgres: {condition: service_healthy, required: false}

  # --- NATS JetStream: one nkey user for each process --------------------------

  # The NATS image has no user, and Docker makes the volume nats-data for
  # root. This one-shot service gives the JetStream store to the user of
  # NATS (65532:65532), then stops: root, with only the capabilities to
  # change the owner of the files (CHOWN) and to read each folder
  # (DAC_READ_SEARCH), and no network. It changes only the files and
  # folders with another owner or group: the files of an earlier release
  # (root, or the user 1000) and the files that NATS of an earlier release
  # wrote after a change back to it. A start with a correct store reads the
  # owner of each file and writes nothing. A stop at any point is safe: the
  # next start changes the rest.
  nats-data-owner:
    <<: [*job, *hardened]
    image: ${NATS_IMAGE:?set NATS_IMAGE in .env}
    user: "0:0"
    cap_add: [CHOWN, DAC_READ_SEARCH]
    network_mode: none
    entrypoint: ["find", "/data", "(", "!", "-user", "65532", "-o", "!", "-group", "65532", ")",
                 "-exec", "chown", "-h", "65532:65532", "{}", "+"]
    volumes:
      - nats-data:/data

  nats:
    <<: *hardened
    image: ${NATS_IMAGE:?set NATS_IMAGE in .env}
    # Any user that is not root: the image has no user. The same user as the
    # NATS of the Helm chart.
    user: "65532:65532"
    command: ["--config", "/etc/nats/nats.conf"]
    configs:
      - {source: nats-conf, target: /etc/nats/nats.conf}
      - {source: nats-users, target: /etc/nats/users.conf}
      - {source: nats-nkeys, target: /etc/nats/nkeys.conf}
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      nats-data-owner: {condition: service_completed_successfully}
    restart: unless-stopped

  # --- OpenBao: the KMS of the wallet (Transit engine) -------------------------
  # Integrated storage (raft) in the volume openbao-data; the static seal
  # unseals it at each start with secrets/openbao/static-seal.key.

  openbao:
    <<: *hardened
    image: ${OPENBAO_IMAGE:?set OPENBAO_IMAGE in .env}
    # The user openbao of the image (100:1000): the volume openbao-data gets
    # the owner of the image folder /openbao/file when Docker makes it, and
    # the data of an earlier release belongs to this user. The entrypoint of
    # the image starts the server directly as this user (no su-exec).
    user: "100:1000"
    command: ["server"]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      # The image entrypoint must not chown the mounted configuration file
      # (a file of this folder).
      SKIP_CHOWN: "true"
    # The temporary files of OpenBao. OpenBao writes its data only to the
    # volume (disable_mlock: no IPC_LOCK capability).
    tmpfs:
      - /tmp:size=64m
    configs:
      - {source: openbao-config, target: /openbao/config/openbao.hcl}
    secrets:
      - {source: openbao-static-seal-key, target: /run/secrets/openbao/static-seal.key}
    volumes:
      - openbao-data:/openbao/file
    # bao status: 0 = unsealed. Before the first initialisation (openbao-init)
    # the check fails.
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Initialises OpenBao one time (secrets/openbao/init.json: the root token
  # and the recovery key), then makes the Transit engine, the userpass
  # login, the policy and the user of the wallet. Idempotent. It runs as
  # your user (HOST_UID, HOST_GID; the Makefile sets them), so that init.json
  # belongs to you.
  openbao-init:
    <<: [*job, *hardened]
    image: ${OPENBAO_IMAGE}
    # Your user (make sets HOST_UID and HOST_GID; README.md, "Security
    # settings"): it writes init.json to your folder secrets/openbao/.
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    entrypoint: ["/bin/sh", "/openbao/bootstrap/bootstrap.sh"]
    environment:
      BAO_ADDR: http://openbao:8200
      OPENBAO_STATE_DIR: /openbao/state
      # The bao client writes no file; HOME must exist for any user.
      HOME: /tmp
    tmpfs:
      - /tmp:size=1m
    configs:
      - {source: openbao-bootstrap, target: /openbao/bootstrap/bootstrap.sh}
    volumes:
      - ./secrets/openbao:/openbao/state
    depends_on:
      openbao: {condition: service_started}

  # --- Valkey: the work queue, the single-use values and the caches of the wallet
  # A primary (valkey), a replica (valkey-replica) and a Sentinel
  # (valkey-sentinel), with ACL users and no default user (README.md,
  # "Valkey"). config/valkey/start.sh writes the configuration of each from
  # the templates of config/valkey/ and the passwords of secrets/valkey/.

  valkey:
    <<: &valkey
      <<: *hardened
      image: ${VALKEY_IMAGE:?set VALKEY_IMAGE in .env}
      # The user valkey of the image (999:1000, as in the Helm chart). The
      # data volume gets its owner from the image folder /data.
      user: "999:1000"
      entrypoint: ["/bin/sh", "/etc/valkey/start.sh"]
      configs:
        - {source: valkey-start, target: /etc/valkey/start.sh}
        - {source: valkey-conf, target: /etc/valkey/valkey.conf}
        - {source: valkey-users, target: /etc/valkey/users.acl}
        - {source: valkey-sentinel-conf, target: /etc/valkey/sentinel.conf}
      secrets:
        - {source: valkey-wallet-config-password, target: /run/secrets/valkey/wallet-config}
        - {source: valkey-wallet-service-password, target: /run/secrets/valkey/wallet-service}
        - {source: valkey-wallet-worker-password, target: /run/secrets/valkey/wallet-worker}
        - {source: valkey-wallet-clock-password, target: /run/secrets/valkey/wallet-clock}
        - {source: valkey-gateway-password, target: /run/secrets/valkey/gateway}
        - {source: valkey-replication-password, target: /run/secrets/valkey/replication}
        - {source: valkey-sentinel-password, target: /run/secrets/valkey/sentinel}
        - {source: valkey-probe-password, target: /run/secrets/valkey/probe}
      # The configuration with the passwords: in memory, never on a volume.
      # /tmp: the temporary files of the shells of start.sh and of the
      # healthchecks (the Helm chart gives the same sizes).
      tmpfs:
        - /run/valkey:size=8m,uid=999,gid=1000,mode=0700
        - /tmp:size=16m
      restart: unless-stopped
    command: ["primary"]
    volumes:
      - valkey-data:/data
    healthcheck: &valkey-healthcheck
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/valkey/probe)\" valkey-cli -p 6379 --user probe ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30

  valkey-replica:
    <<: *valkey
    command: ["replica"]
    volumes:
      - valkey-replica-data:/data
    healthcheck:
      <<: *valkey-healthcheck
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/valkey/probe)\" valkey-cli -p 6379 --user probe info replication | grep -q -E 'role:master|master_link_status:up'"]
    depends_on:
      valkey: {condition: service_healthy}

  valkey-sentinel:
    <<: *valkey
    command: ["sentinel"]
    healthcheck:
      <<: *valkey-healthcheck
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(cat /run/secrets/valkey/probe)\" valkey-cli -p 26379 --user probe ping | grep -q PONG"]
    depends_on:
      valkey-replica: {condition: service_healthy}

  # --- Migrations and read access (one-shot) -----------------------------------

  api-migrate:
    <<: [*job, *hardened]
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY in .env}/api:${PLATFORM_TAG:?set PLATFORM_TAG in .env}
    # The user nonroot of the image. The image has no shell: each command
    # of the api is the program itself.
    user: "65532:65532"
    command: ["/app/bin/igrant-api", "migrate", "--config", "/etc/igrant-api/database-jobs.yaml"]
    tmpfs:
      - /tmp:size=16m
    labels:
      io.igrant.config-sha256.api-database-jobs-config: ${CONFIG_SHA256_API_DATABASE_JOBS_CONFIG:?run make configs}
    configs:
      - {source: api-database-jobs-config, target: /etc/igrant-api/database-jobs.yaml}
    secrets:
      - {source: db-igrant-api-password, target: /run/secrets/igrant-api/db-password}
      - {source: db-igrant-oidc-password, target: /run/secrets/igrant-api/oidc-db-password}
    depends_on:
      database-init: {condition: service_completed_successfully}

  consent-migrate:
    <<: [*job, *hardened]
    image: ${IMAGE_REGISTRY:?set IMAGE_REGISTRY in .env}/consent-management-backend:${PLATFORM_TAG:?set PLATFORM_TAG in .env}
    user: "65532:65532"
    command: ["migrate", "schema", "--config", "/etc/consent/migrate.yaml"]
    tmpfs:
      - /tmp:size=16m
    labels:
      io.igrant.config-sha256.consent-migrate-config: ${CONFIG_SHA256_CONSENT_MIGRATE_CONFIG:?run make configs}
    configs:
      - {source: consent-migrate-config, target: /etc/consent/migrate.yaml}
    secrets:
      - {source: db-igrant-consent-password, target: /run/secrets/consent/database-password}
    depends_on:
      database-init: {condition: service_completed_successfully}

  # The database roles of the wallet (database-roles apply, as the admin
  # user): the owner role igrant_wallet_owner, the login database roles
  # igrant_wallet_<name> with their passwords (one file each in
  # --password-dir, named without the prefix), the data scope schemas, the
  # objects of an older release given to the owner role, and the grants.
  # The prefix igrant_wallet is the name of the wallet database.
  wallet-database-roles:
    <<: [*job, *hardened]
    image: ${IMAGE_REGISTRY}/eudi-wallet:${PLATFORM_TAG}
    # The user ows of the image.
    user: "65532:65532"
    tmpfs:
      - /tmp:size=64m
    entrypoint: ["/app/.venv/bin/database-roles"]
    command:
      - apply
      - --password-dir
      - /run/secrets/database-roles
      - --admin-user
      - ${DB_ADMIN_USER}
      - --admin-password-file
      - /run/secrets/database/admin-password
    environment:
      EUDI_WALLET_CONFIG: /etc/eudi-wallet/database-admin.yaml
    labels:
      io.igrant.config-sha256.wallet-database-admin-config: ${CONFIG_SHA256_WALLET_DATABASE_ADMIN_CONFIG:?run make configs}
    configs:
      - {source: wallet-database-admin-config, target: /etc/eudi-wallet/database-admin.yaml}
    secrets:
      - {source: database-admin-password, target: /run/secrets/database/admin-password}
      - {source: db-igrant-wallet-migrator-password, target: /run/secrets/database-roles/migrator}
      - {source: db-igrant-wallet-launcher-app-password, target: /run/secrets/database-roles/launcher_app}
      - {source: db-igrant-wallet-jobs-password, target: /run/secrets/database-roles/jobs}
      - {source: db-igrant-wallet-clock-password, target: /run/secrets/database-roles/clock}
      - {source: db-igrant-wallet-audit-reader-password, target: /run/secrets/database-roles/audit_reader}
      - {source: db-igrant-wallet-issuer-app-password, target: /run/secrets/database-roles/issuer_app}
      - {source: db-igrant-wallet-relying-party-app-password, target: /run/secrets/database-roles/relying_party_app}
      - {source: db-igrant-wallet-business-wallet-app-password, target: /run/secrets/database-roles/business_wallet_app}
      - {source: db-igrant-wallet-individual-wp-app-password, target: /run/secrets/database-roles/individual_wp_app}
      - {source: db-igrant-wallet-business-wp-app-password, target: /run/secrets/database-roles/business_wp_app}
      - {source: db-igrant-wallet-admin-app-password, target: /run/secrets/database-roles/admin_app}
    depends_on:
      database-init: {condition: service_completed_successfully}

  # The migrations of the wallet (migrate-database), as the migrator
  # igrant_wallet_migrator: the revisions run as the owner role, then the
  # grant step gives the database roles their grants on the new objects.
  # Only this service changes the schema of the wallet.
  wallet-migrate:
    <<: [*job, *hardened]
    image: ${IMAGE_REGISTRY}/eudi-wallet:${PLATFORM_TAG}
    user: "65532:65532"
    tmpfs:
      - /tmp:size=64m
    entrypoint: ["/app/.venv/bin/migrate-database"]
    environment:
      EUDI_WALLET_CONFIG: /etc/eudi-wallet/migrate.yaml
    labels:
      io.igrant.config-sha256.wallet-migrate-config: ${CONFIG_SHA256_WALLET_MIGRATE_CONFIG:?run make configs}
    configs:
      - {source: wallet-migrate-config, target: /etc/eudi-wallet/migrate.yaml}
    secrets:
      - {source: db-igrant-wallet-migrator-password, target: /run/secrets/eudi-wallet/database-password}
    depends_on:
      wallet-database-roles: {condition: service_completed_successfully}

  # The export index of the audit events (audit partitions index), as the
  # migrator, after wallet-migrate: the index of the monthly export on each
  # partitioned table and partition. It finds nothing to do on a normal
  # start and ends in seconds; on the first start with the step, a large
  # month that is not exported can take hours. No service waits for it;
  # the export of a month waits until its index is valid.
  wallet-export-index:
    <<: [*job, *hardened]
    image: ${IMAGE_REGISTRY}/eudi-wallet:${PLATFORM_TAG}
    user: "65532:65532"
    tmpfs:
      - /tmp:size=64m
    entrypoint: ["/app/.venv/bin/audit", "partitions", "index"]
    environment:
      EUDI_WALLET_CONFIG: /etc/eudi-wallet/migrate.yaml
    labels:
      io.igrant.config-sha256.wallet-migrate-config: ${CONFIG_SHA256_WALLET_MIGRATE_CONFIG:?run make configs}
    configs:
      - {source: wallet-migrate-config, target: /etc/eudi-wallet/migrate.yaml}
    secrets:
      - {source: db-igrant-wallet-migrator-password, target: /run/secrets/eudi-wallet/database-password}
    depends_on:
      wallet-migrate: {condition: service_completed_successfully}

  # The owner of a database makes the read-only users of the other services
  # on its views (rule <reader>_<owner>_reader) with its read-access command.
  # The admin user (DB_ADMIN_USER) makes the users. The api image has no
  # shell: one service for each reader of the api database.
  api-read-access-wallet:
    <<: [*job, *hardened]
    image: ${IMAGE_REGISTRY}/api:${PLATFORM_TAG}
    user: "65532:65532"
    command: ["/app/bin/igrant-api", "read-access", "apply", "--config", "/etc/igrant-api/database-jobs.yaml",
              "--reader", "wallet", "--user", "wallet_api_reader", "--password-file", "/run/secrets/read-access/wallet_api_reader",
              "--admin-user", "${DB_ADMIN_USER}", "--admin-password-file", "/run/secrets/database/admin-password"]
    tmpfs:
      - /tmp:size=16m
    labels:
      io.igrant.config-sha256.api-database-jobs-config: ${CONFIG_SHA256_API_DATABASE_JOBS_CONFIG:?run make configs}
    configs:
      - {source: api-database-jobs-config, target: /etc/igrant-api/database-jobs.yaml}
    secrets:
      - {source: db-igrant-api-password, target: /run/secrets/igrant-api/db-password}
      - {source: db-igrant-oidc-password, target: /run/secrets/igrant-api/oidc-db-password}
      - {source: database-admin-password, target: /run/secrets/database/admin-password}
      - {source: reader-wallet-api-password, target: /run/secrets/read-access/wallet_api_reader}
    depends_on:
      api-migrate: {condition: service_completed_successfully}

  api-read-access-consent:
    <<: [*job, *hardened]
    image: ${IMAGE_REGISTRY}/api:${PLATFORM_TAG}
    user: "65532:65532"
    command: ["/app/bin/igrant-api", "read-access", "apply", "--config", "/etc/igrant-api/database-jobs.yaml",
              "--reader", "consent", "--user", "consent_api_reader", "--password-file", "/run/secrets/read-access/consent_api_reader",
              "--admin-user", "${DB_ADMIN_USER}", "--admin-password-file", "/run/secrets/database/admin-password"]
    tmpfs:
      - /tmp:size=16m
    labels:
      io.igrant.config-sha256.api-database-jobs-config: ${CONFIG_SHA256_API_DATABASE_JOBS_CONFIG:?run make configs}
    configs:
      - {source: api-database-jobs-config, target: /etc/igrant-api/database-jobs.yaml}
    secrets:
      - {source: db-igrant-api-password, target: /run/secrets/igrant-api/db-password}
      - {source: db-igrant-oidc-password, target: /run/secrets/igrant-api/oidc-db-password}
      - {source: database-admin-password, target: /run/secrets/database/admin-password}
      - {source: reader-consent-api-password, target: /run/secrets/read-access/consent_api_reader}
    depends_on:
      api-migrate: {condition: service_completed_successfully}

  consent-read-access:
    <<: [*job, *hardened]
    image: ${IMAGE_REGISTRY}/consent-management-backend:${PLATFORM_TAG}
    user: "65532:65532"
    tmpfs:
      - /tmp:size=16m
    command:
      - read-access
      - apply
      - --config
      - /etc/consent/migrate.yaml
      - --reader
      - wallet
      - --user
      - wallet_consent_reader
      - --password-file
      - /run/secrets/read-access/wallet_consent_reader
      - --admin-user
      - ${DB_ADMIN_USER}
      - --admin-password-file
      - /run/secrets/database/admin-password
    labels:
      io.igrant.config-sha256.consent-migrate-config: ${CONFIG_SHA256_CONSENT_MIGRATE_CONFIG:?run make configs}
    configs:
      - {source: consent-migrate-config, target: /etc/consent/migrate.yaml}
    secrets:
      - {source: db-igrant-consent-password, target: /run/secrets/consent/database-password}
      - {source: database-admin-password, target: /run/secrets/database/admin-password}
      - {source: reader-wallet-consent-password, target: /run/secrets/read-access/wallet_consent_reader}
    depends_on:
      consent-migrate: {condition: service_completed_successfully}

  wallet-read-access-api:
    <<: [*job, *hardened]
    image: ${IMAGE_REGISTRY}/eudi-wallet:${PLATFORM_TAG}
    user: "65532:65532"
    tmpfs:
      - /tmp:size=64m
    # The wallet image has no shell: one service for each reader, which runs
    # the program read-access directly.
    entrypoint: ["/app/.venv/bin/read-access"]
    command:
      - apply
      - --reader
      - api
      - --user
      - api_wallet_reader
      - --password-file
      - /run/secrets/read-access/api_wallet_reader
      - --admin-user
      - ${DB_ADMIN_USER}
      - --admin-password-file
      - /run/secrets/database/admin-password
    environment:
      EUDI_WALLET_CONFIG: /etc/eudi-wallet/database-admin.yaml
    labels:
      io.igrant.config-sha256.wallet-database-admin-config: ${CONFIG_SHA256_WALLET_DATABASE_ADMIN_CONFIG:?run make configs}
    configs:
      - {source: wallet-database-admin-config, target: /etc/eudi-wallet/database-admin.yaml}
    secrets:
      - {source: database-admin-password, target: /run/secrets/database/admin-password}
      - {source: reader-api-wallet-password, target: /run/secrets/read-access/api_wallet_reader}
    depends_on:
      wallet-migrate: {condition: service_completed_successfully}

  wallet-read-access-consent:
    <<: [*job, *hardened]
    image: ${IMAGE_REGISTRY}/eudi-wallet:${PLATFORM_TAG}
    user: "65532:65532"
    tmpfs:
      - /tmp:size=64m
    # The wallet image has no shell: one service for each reader, which runs
    # the program read-access directly.
    entrypoint: ["/app/.venv/bin/read-access"]
    command:
      - apply
      - --reader
      - consent
      - --user
      - consent_wallet_reader
      - --password-file
      - /run/secrets/read-access/consent_wallet_reader
      - --admin-user
      - ${DB_ADMIN_USER}
      - --admin-password-file
      - /run/secrets/database/admin-password
    environment:
      EUDI_WALLET_CONFIG: /etc/eudi-wallet/database-admin.yaml
    labels:
      io.igrant.config-sha256.wallet-database-admin-config: ${CONFIG_SHA256_WALLET_DATABASE_ADMIN_CONFIG:?run make configs}
    configs:
      - {source: wallet-database-admin-config, target: /etc/eudi-wallet/database-admin.yaml}
    secrets:
      - {source: database-admin-password, target: /run/secrets/database/admin-password}
      - {source: reader-consent-wallet-password, target: /run/secrets/read-access/consent_wallet_reader}
    depends_on:
      wallet-migrate: {condition: service_completed_successfully}
  # --- api core, webhook handler and auth gateway ------------------------------

  # The auth gateway: the only public entry of the API. It checks each
  # request and sends it to the component that owns the route: the api
  # core, consent or the config role of the wallet.
  gateway:
    <<: [*server, *hardened]
    image: ${IMAGE_REGISTRY}/gateway:${PLATFORM_TAG}
    # The user nonroot of the image. The gateway writes no file.
    user: "65532:65532"
    command: ["--config", "/etc/igrant-gateway/config.yaml"]
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${API_PORT:-8080}:8070"
    labels:
      io.igrant.config-sha256.gateway-config: ${CONFIG_SHA256_GATEWAY_CONFIG:?run make configs}
    configs:
      - {source: gateway-config, target: /etc/igrant-gateway/config.yaml}
      - {source: token-verification-jwks, target: /etc/igrant-gateway/token-verification-jwks.json}
    secrets:
      - {source: api-secret-key, target: /run/secrets/igrant-gateway/api-secret-key}
      - {source: db-igrant-api-password, target: /run/secrets/igrant-gateway/db-password}
      - {source: api-token-hash-secret, target: /run/secrets/igrant-gateway/token-hash-secret.json}
      - {source: gateway-internal-token-jwks, target: /run/secrets/igrant-gateway/internal-token-jwks.json}
      # The password of its Valkey user (the failure counters of unknown API
      # keys).
      - {source: valkey-gateway-password, target: /run/secrets/igrant-gateway/redis-password}
    depends_on:
      api-migrate: {condition: service_completed_successfully}
      valkey-sentinel: {condition: service_started}

  api:
    <<: [*server, *hardened]
    image: ${IMAGE_REGISTRY}/api:${PLATFORM_TAG}
    # The user nonroot of the image. It listens on port 80: the sysctl lets
    # a non-root user open a port below 1024 (also the default of Docker).
    user: "65532:65532"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    command: ["/app/bin/igrant-api", "start-api", "--config", "/etc/igrant-api/config.yaml"]
    # The temporary files of the multipart parser of Go.
    tmpfs:
      - /tmp:size=64m
    labels:
      io.igrant.config-sha256.api-config: ${CONFIG_SHA256_API_CONFIG:?run make configs}
    configs:
      - {source: api-config, target: /etc/igrant-api/config.yaml}
      - {source: gateway-jwks, target: /etc/igrant-gateway-keys/gateway-jwks.json}
      - {source: service-jwks-api, target: /etc/igrant-service-keys/igrant-api.json}
      - {source: service-jwks-consent, target: /etc/igrant-service-keys/igrant-consent-management.json}
      - {source: service-jwks-wallet, target: /etc/igrant-service-keys/eudi-wallet.json}
    secrets:
      - {source: api-secret-key, target: /run/secrets/igrant-api/api-secret-key}
      - {source: db-igrant-api-password, target: /run/secrets/igrant-api/db-password}
      - {source: db-igrant-oidc-password, target: /run/secrets/igrant-api/oidc-db-password}
      - {source: api-token-hash-secret, target: /run/secrets/igrant-api/token-hash-secret.json}
      - {source: api-token-signing-jwks, target: /run/secrets/igrant-api/token-signing-jwks.json}
      - {source: api-db-wrapping-keys, target: /run/secrets/igrant-api/db-wrapping-keys.json}
      - {source: api-service-key, target: /run/secrets/igrant-api/service-envelope-jwks.json}
      - {source: reader-api-wallet-password, target: /run/secrets/igrant-api/read-access-wallet-password}
      - {source: nats-seed-api, target: /run/secrets/igrant-api/nats-seed}
      - {source: smtp-password, target: /run/secrets/igrant-api/smtp-password}
    depends_on:
      api-migrate: {condition: service_completed_successfully}
      wallet-read-access-api: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  # start-webhook-api: the NATS consumers of the webhooks and of the
  # passwordless login events (its own NATS user api-webhook).
  webhook:
    <<: [*server, *hardened]
    image: ${IMAGE_REGISTRY}/api:${PLATFORM_TAG}
    # The user nonroot of the image. It listens on port 80: the sysctl lets
    # a non-root user open a port below 1024 (also the default of Docker).
    user: "65532:65532"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    command: ["/app/bin/igrant-api", "start-webhook-api", "--config", "/etc/igrant-api/config.yaml"]
    # The temporary files of the multipart parser of Go.
    tmpfs:
      - /tmp:size=64m
    labels:
      io.igrant.config-sha256.webhook-config: ${CONFIG_SHA256_WEBHOOK_CONFIG:?run make configs}
    configs:
      - {source: webhook-config, target: /etc/igrant-api/config.yaml}
      - {source: gateway-jwks, target: /etc/igrant-gateway-keys/gateway-jwks.json}
      - {source: service-jwks-api, target: /etc/igrant-service-keys/igrant-api.json}
      - {source: service-jwks-consent, target: /etc/igrant-service-keys/igrant-consent-management.json}
      - {source: service-jwks-wallet, target: /etc/igrant-service-keys/eudi-wallet.json}
    secrets:
      - {source: api-secret-key, target: /run/secrets/igrant-api/api-secret-key}
      - {source: db-igrant-api-password, target: /run/secrets/igrant-api/db-password}
      - {source: db-igrant-oidc-password, target: /run/secrets/igrant-api/oidc-db-password}
      - {source: api-token-hash-secret, target: /run/secrets/igrant-api/token-hash-secret.json}
      - {source: api-token-signing-jwks, target: /run/secrets/igrant-api/token-signing-jwks.json}
      - {source: api-db-wrapping-keys, target: /run/secrets/igrant-api/db-wrapping-keys.json}
      - {source: api-service-key, target: /run/secrets/igrant-api/service-envelope-jwks.json}
      - {source: reader-api-wallet-password, target: /run/secrets/igrant-api/read-access-wallet-password}
      - {source: nats-seed-api-webhook, target: /run/secrets/igrant-api/nats-seed}
      - {source: smtp-password, target: /run/secrets/igrant-api/smtp-password}
    depends_on:
      api-migrate: {condition: service_completed_successfully}
      wallet-read-access-api: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  # --- Consent --------------------------------------------------------------------

  consent:
    <<: [*server, *hardened]
    image: ${IMAGE_REGISTRY}/consent-management-backend:${PLATFORM_TAG}
    # The user nonroot of the image. It listens on port 80 (see api).
    user: "65532:65532"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    command: ["serve", "--config", "/etc/consent/config.yaml"]
    tmpfs:
      - /tmp:size=64m
    labels:
      io.igrant.config-sha256.consent-config: ${CONFIG_SHA256_CONSENT_CONFIG:?run make configs}
    configs:
      - {source: consent-config, target: /etc/consent/config.yaml}
      - {source: gateway-jwks, target: /etc/igrant-gateway-keys/gateway-jwks.json}
      - {source: service-jwks-api, target: /etc/igrant-service-keys/igrant-api.json}
      - {source: service-jwks-wallet, target: /etc/igrant-service-keys/eudi-wallet.json}
    secrets:
      - {source: db-igrant-consent-password, target: /run/secrets/consent/database-password}
      - {source: consent-service-key, target: /run/secrets/consent/service-envelope-jwks.json}
      - {source: nats-seed-consent, target: /run/secrets/consent/nats-seed}
      - {source: reader-consent-api-password, target: /run/secrets/consent/read-access-api-password}
      - {source: reader-consent-wallet-password, target: /run/secrets/consent/read-access-wallet-password}
    depends_on:
      consent-migrate: {condition: service_completed_successfully}
      api-read-access-consent: {condition: service_completed_successfully}
      wallet-read-access-consent: {condition: service_completed_successfully}
      nats: {condition: service_healthy}

  # --- Organisation wallet: config, service, worker and clock roles of one image
  # The image entrypoint only starts the process (it applies no migration):
  # wallet-migrate changes the schema before the processes start. Each
  # process (but the clock) waits until the schema is at the head of its
  # code, and connects with a database role that cannot change the schema:
  # config and service as igrant_wallet_launcher_app, the worker as
  # igrant_wallet_jobs, the clock as igrant_wallet_clock.

  # The config routes: only the gateway calls them (internal token).
  wallet-config:
    <<: *wallet
    labels:
      io.igrant.config-sha256.wallet-config-config: ${CONFIG_SHA256_WALLET_CONFIG_CONFIG:?run make configs}
    configs:
      - {source: wallet-config-config, target: /etc/eudi-wallet/config.yaml}
      - {source: gateway-jwks, target: /etc/igrant-gateway-keys/gateway-jwks.json}
      - {source: service-jwks-api, target: /etc/igrant-service-keys/igrant-api.json}
    secrets:
      - {source: db-igrant-wallet-launcher-app-password, target: /run/secrets/eudi-wallet/database-password}
      - {source: wallet-service-key, target: /run/secrets/eudi-wallet/service-envelope-jwks.json}
      - {source: nats-seed-wallet-config, target: /run/secrets/eudi-wallet/nats-seed}
      - {source: valkey-wallet-config-password, target: /run/secrets/eudi-wallet/redis-password}
      - {source: openbao-wallet-password, target: /run/secrets/eudi-wallet/openbao-password}
      - {source: reader-wallet-api-password, target: /run/secrets/eudi-wallet/read-access-api-password}
      - {source: reader-wallet-consent-password, target: /run/secrets/eudi-wallet/read-access-consent-password}
    healthcheck: &wallet-healthcheck
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      wallet-migrate: {condition: service_completed_successfully}
      api-read-access-wallet: {condition: service_completed_successfully}
      consent-read-access: {condition: service_completed_successfully}
      nats: {condition: service_healthy}
      openbao-init: {condition: service_completed_successfully}
      valkey-sentinel: {condition: service_started}

  # The public routes of the wallet (OpenID4VCI, OpenID4VP, wallet units).
  wallet-service:
    <<: *wallet
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${WALLET_PORT:-8090}:8080"
    labels:
      io.igrant.config-sha256.wallet-service-config: ${CONFIG_SHA256_WALLET_SERVICE_CONFIG:?run make configs}
    configs:
      - {source: wallet-service-config, target: /etc/eudi-wallet/config.yaml}
    secrets:
      - {source: db-igrant-wallet-launcher-app-password, target: /run/secrets/eudi-wallet/database-password}
      - {source: wallet-service-key, target: /run/secrets/eudi-wallet/service-envelope-jwks.json}
      - {source: nats-seed-wallet-service, target: /run/secrets/eudi-wallet/nats-seed}
      - {source: valkey-wallet-service-password, target: /run/secrets/eudi-wallet/redis-password}
      - {source: openbao-wallet-password, target: /run/secrets/eudi-wallet/openbao-password}
    healthcheck: *wallet-healthcheck
    depends_on: &wallet-role-depends
      wallet-migrate: {condition: service_completed_successfully}
      nats: {condition: service_healthy}
      openbao-init: {condition: service_completed_successfully}
      valkey-sentinel: {condition: service_started}

  # The worker (README.md, "Worker and clock"): the actors of all queues of
  # Valkey. A stop waits at most 3600 s for the running actors (the longest
  # time limit without an audit bucket: the retention purge of an
  # organisation); an actor that does not end in that time runs again from
  # its message.
  wallet-worker:
    <<: *wallet
    command: ["/app/.venv/bin/dramatiq", "ows.worker.run:start", "--processes", "1", "--threads", "8",
              "--worker-shutdown-timeout", "3600000", "--worker-fork-timeout", "600000", "--queues", "realtime", "attestation", "status", "kms", "maintenance"]
    stop_grace_period: 3630s
    labels:
      io.igrant.config-sha256.wallet-worker-config: ${CONFIG_SHA256_WALLET_WORKER_CONFIG:?run make configs}
    configs:
      - {source: wallet-worker-config, target: /etc/eudi-wallet/config.yaml}
    secrets:
      - {source: db-igrant-wallet-jobs-password, target: /run/secrets/eudi-wallet/database-password}
      - {source: wallet-service-key, target: /run/secrets/eudi-wallet/service-envelope-jwks.json}
      - {source: nats-seed-wallet-worker, target: /run/secrets/eudi-wallet/nats-seed}
      - {source: valkey-wallet-worker-password, target: /run/secrets/eudi-wallet/redis-password}
      - {source: openbao-wallet-password, target: /run/secrets/eudi-wallet/openbao-password}
    # The heartbeat and metric files of the worker processes
    # (worker.state_directory).
    tmpfs:
      - /run/ows-worker:size=64m
    # /tmp on the disk of the host, not in memory: the monthly audit export
    # (only with AUDIT_BUCKET_NAME) writes one month of the audit log of one
    # data scope two times to /tmp/ows-audit-export-* (README.md, "Security
    # settings").
    volumes:
      - wallet-worker-tmp:/tmp
    # /readyz of the health port: Valkey and the database.
    healthcheck:
      <<: *wallet-healthcheck
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9191/readyz', timeout=3)"]
    depends_on: *wallet-role-depends

  # The clock (README.md, "Worker and clock"): it sends the cron actors to
  # the queues when their time comes. It holds the leader lock of the
  # database while it sends; it connects to no NATS and to no key store.
  wallet-clock:
    <<: *wallet
    command: ["/app/.venv/bin/start-clock"]
    stop_grace_period: 30s
    tmpfs:
      - /tmp:size=64m
    labels:
      io.igrant.config-sha256.wallet-clock-config: ${CONFIG_SHA256_WALLET_CLOCK_CONFIG:?run make configs}
    configs:
      - {source: wallet-clock-config, target: /etc/eudi-wallet/config.yaml}
    secrets:
      - {source: db-igrant-wallet-clock-password, target: /run/secrets/eudi-wallet/database-password}
      - {source: valkey-wallet-clock-password, target: /run/secrets/eudi-wallet/redis-password}
    healthcheck:
      <<: *wallet-healthcheck
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9192/readyz', timeout=3)"]
    depends_on:
      wallet-migrate: {condition: service_completed_successfully}
      valkey-sentinel: {condition: service_started}

  # --- Dashboard ----------------------------------------------------------------

  dashboard:
    <<: *hardened
    image: ${IMAGE_REGISTRY}/dashboard:${PLATFORM_TAG}
    # The user nginx of the image. It listens on port 80 (see api).
    user: "101:101"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-3000}:80"
    labels:
      io.igrant.config-sha256.dashboard-config: ${CONFIG_SHA256_DASHBOARD_CONFIG:?run make configs}
    configs:
      - {source: dashboard-config, target: /usr/share/nginx/html/config/config.json}
    # The pid file and the temporary files of nginx, and the files of the
    # start scripts of the image (/tmp/dashboard).
    tmpfs:
      - /tmp:size=64m
    depends_on:
      gateway: {condition: service_started}
    restart: unless-stopped

volumes:
  postgres-data:
  nats-data:
  openbao-data:
  # /tmp of the wallet worker (the files of the audit export).
  wallet-worker-tmp:
  # The AOF files of the Valkey primary and replica.
  valkey-data:
  valkey-replica-data:

# The secret files of make secrets. A file that is missing stops "docker
# compose up" (run make secrets; make check finds it first).
secrets:
  database-admin-password: {file: ./secrets/database/admin-password}
  db-igrant-api-password: {file: ./secrets/database/igrant_api-password}
  db-igrant-oidc-password: {file: ./secrets/database/igrant_oidc-password}
  db-igrant-consent-password: {file: ./secrets/database/igrant_consent-password}
  db-igrant-wallet-password: {file: ./secrets/database/igrant_wallet-password}
  # The login database roles of the wallet (wallet-database-roles).
  db-igrant-wallet-migrator-password: {file: ./secrets/database/igrant_wallet_migrator-password}
  db-igrant-wallet-launcher-app-password: {file: ./secrets/database/igrant_wallet_launcher_app-password}
  db-igrant-wallet-jobs-password: {file: ./secrets/database/igrant_wallet_jobs-password}
  db-igrant-wallet-clock-password: {file: ./secrets/database/igrant_wallet_clock-password}
  db-igrant-wallet-audit-reader-password: {file: ./secrets/database/igrant_wallet_audit_reader-password}
  db-igrant-wallet-issuer-app-password: {file: ./secrets/database/igrant_wallet_issuer_app-password}
  db-igrant-wallet-relying-party-app-password: {file: ./secrets/database/igrant_wallet_relying_party_app-password}
  db-igrant-wallet-business-wallet-app-password: {file: ./secrets/database/igrant_wallet_business_wallet_app-password}
  db-igrant-wallet-individual-wp-app-password: {file: ./secrets/database/igrant_wallet_individual_wp_app-password}
  db-igrant-wallet-business-wp-app-password: {file: ./secrets/database/igrant_wallet_business_wp_app-password}
  db-igrant-wallet-admin-app-password: {file: ./secrets/database/igrant_wallet_admin_app-password}
  reader-api-wallet-password: {file: ./secrets/database/api_wallet_reader-password}
  reader-consent-api-password: {file: ./secrets/database/consent_api_reader-password}
  reader-consent-wallet-password: {file: ./secrets/database/consent_wallet_reader-password}
  reader-wallet-api-password: {file: ./secrets/database/wallet_api_reader-password}
  reader-wallet-consent-password: {file: ./secrets/database/wallet_consent_reader-password}
  api-secret-key: {file: ./secrets/api/api-secret-key}
  api-token-hash-secret: {file: ./secrets/api/token-hash-secret.json}
  api-token-signing-jwks: {file: ./secrets/api/token-signing-jwks.json}
  api-db-wrapping-keys: {file: ./secrets/api/db-wrapping-keys.json}
  api-service-key: {file: ./secrets/api/service-envelope-jwks.json}
  nats-seed-api: {file: ./secrets/api/nats-api.nk}
  nats-seed-api-webhook: {file: ./secrets/api/nats-api-webhook.nk}
  # The password of SMTP_USERNAME (make secrets asks for it). Empty when
  # SMTP_USERNAME is empty (no SMTP authentication).
  smtp-password: {file: ./secrets/api/smtp-password}
  gateway-internal-token-jwks: {file: ./secrets/gateway/internal-token-jwks.json}
  consent-service-key: {file: ./secrets/consent/service-envelope-jwks.json}
  nats-seed-consent: {file: ./secrets/consent/nats-consent.nk}
  wallet-service-key: {file: ./secrets/wallet/service-envelope-jwks.json}
  nats-seed-wallet-config: {file: ./secrets/wallet/nats-wallet-config.nk}
  nats-seed-wallet-service: {file: ./secrets/wallet/nats-wallet-service.nk}
  nats-seed-wallet-worker: {file: ./secrets/wallet/nats-wallet-worker.nk}
  openbao-wallet-password: {file: ./secrets/openbao/wallet-password}
  openbao-static-seal-key: {file: ./secrets/openbao/static-seal.key}
  # The passwords of the ACL users of Valkey: the wallet roles, the gateway,
  # and the users of the Valkey services (replication, sentinel, probe).
  valkey-wallet-config-password: {file: ./secrets/valkey/wallet-config-password}
  valkey-wallet-service-password: {file: ./secrets/valkey/wallet-service-password}
  valkey-wallet-worker-password: {file: ./secrets/valkey/wallet-worker-password}
  valkey-wallet-clock-password: {file: ./secrets/valkey/wallet-clock-password}
  valkey-gateway-password: {file: ./secrets/valkey/gateway-password}
  valkey-replication-password: {file: ./secrets/valkey/replication-password}
  valkey-sentinel-password: {file: ./secrets/valkey/sentinel-password}
