# The iGrant.io platform on Docker Compose. See README.md for the steps:
#
#   make env       create .env from .env.example, then set your values
#   make secrets   create all secrets and keys in secrets/
#   make check     write the configuration files to generated/ (make
#                  configs), then check the configuration (starts no
#                  container)
#   make up        start the platform
#
# The services are in compose.platform.yaml. This file loads it with these
# values files:
#   - .env: your settings, for example DB_ENGINE (postgresql), the public
#     URLs and the images;
#   - config/engine/<DB_ENGINE>.env: the values that follow from the engine
#     (database port, admin user, client image);
#   - generated/configs.env: the SHA-256 of each configuration file (below).
# So DB_ENGINE alone picks the database engine of all components. A value
# set in your shell overrides the same value in .env.
#
# The components' configuration files are in generated/: "make configs"
# writes them from the compose.configs.yaml templates with the values of the
# first two files (compose.render.yaml). It also writes generated/configs.env
# with the SHA-256 of each file. Each service has its file's hash in a
# label, so "docker compose up" restarts a service when its file changes.
# Without generated/configs.env, docker compose stops: run make configs
# (make check and make up run it).
name: igrant-platform

include:
  - path: compose.platform.yaml
    env_file:
      - .env
      - config/engine/${DB_ENGINE:-postgresql}.env
      - generated/configs.env
