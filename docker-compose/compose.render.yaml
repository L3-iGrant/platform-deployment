# Loads the configuration file templates (compose.configs.yaml) with the
# platform's values. "make configs" (render-configs.py) reads this file with
# "docker compose config"; nothing in it starts. It uses the same values
# files as docker-compose.yaml, in the same order, so Compose fills in the
# same values as for the services (a value set in your shell wins).
# docker-compose.yaml also loads generated/configs.env, the hash of each
# file that this render writes.
name: igrant-platform-render

include:
  - path: compose.configs.yaml
    env_file:
      - .env
      - config/engine/${DB_ENGINE:-postgresql}.env
