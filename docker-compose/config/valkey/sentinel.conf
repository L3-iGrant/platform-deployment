# The Sentinel of Valkey (valkey-sentinel): the template of
# /run/valkey/sentinel.conf. start.sh puts in the passwords, the hashes and
# the primary ({primary}). The Sentinel rewrites the file (its state).
bind * -::*
port 26379
dir /run/valkey
sentinel resolve-hostnames yes
sentinel announce-hostnames yes
sentinel announce-ip {self}
sentinel announce-port 26379
# One Sentinel: the quorum is 1. It promotes the replica when the primary
# does not answer for 5 seconds.
sentinel monitor ows {primary} 6379 1
sentinel down-after-milliseconds ows 5000
sentinel failover-timeout ows 60000
sentinel parallel-syncs ows 1
sentinel auth-user ows sentinel
sentinel auth-pass ows {password:sentinel}
user default off
user sentinel on {hash:sentinel} -@all +auth +ping +sentinel|get-master-addr-by-name
user probe on {hash:probe} -@all +ping
user wallet-config on {hash:wallet-config} -@all +ping +auth +hello +client|setinfo +client|setname +sentinel|masters +sentinel|master +sentinel|get-master-addr-by-name +sentinel|replicas +sentinel|slaves +sentinel|sentinels
user wallet-service on {hash:wallet-service} -@all +ping +auth +hello +client|setinfo +client|setname +sentinel|masters +sentinel|master +sentinel|get-master-addr-by-name +sentinel|replicas +sentinel|slaves +sentinel|sentinels
user wallet-worker on {hash:wallet-worker} -@all +ping +auth +hello +client|setinfo +client|setname +sentinel|masters +sentinel|master +sentinel|get-master-addr-by-name +sentinel|replicas +sentinel|slaves +sentinel|sentinels
user wallet-clock on {hash:wallet-clock} -@all +ping +auth +hello +client|setinfo +client|setname +sentinel|masters +sentinel|master +sentinel|get-master-addr-by-name +sentinel|replicas +sentinel|slaves +sentinel|sentinels
user gateway on {hash:gateway} -@all +ping +auth +hello +client|setinfo +client|setname +sentinel|masters +sentinel|master +sentinel|get-master-addr-by-name +sentinel|replicas +sentinel|slaves +sentinel|sentinels
