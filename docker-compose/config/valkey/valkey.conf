# Template of /run/valkey/valkey.conf for the Valkey data servers (valkey,
# the primary at the first start, and valkey-replica). start.sh fills in the
# password of the replication user ({password:replication}) and the service
# name ({self}). Like the other services in this folder, Valkey has no TLS
# on the Compose network.
bind * -::*
port 6379
dir /data
aclfile /run/valkey/users.acl
# A server that stops loses at most about one second of writes.
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
# Never evict a key: an eviction would delete queue messages or nonces.
maxmemory 256mb
maxmemory-policy noeviction
# Without an in-sync replica the primary refuses writes, so the wallet
# accepts a single-use value only when a replica has it.
min-replicas-to-write 1
min-replicas-max-lag 10
# Replication login. After a failover, the old primary becomes a replica.
masteruser replication
masterauth {password:replication}
# The Sentinel gives clients the service names.
replica-announce-ip {self}
