# An extra small production installation (docs/prerequisites.md): up to
# about 10,000 wallet units and 10 organisations with little traffic, on 3
# nodes with about 1 vCPU and 4.4 GiB
# allocatable each (for example GKE e2-custom-medium-6144). It keeps the
# redundancy of the defaults (2 replicas of each public service, 3 OpenBao,
# NATS and Valkey pods) and lowers the CPU and memory requests to the measured
# use of an installation with about 9,000 wallet units, with a margin.
# Total requests: about 1 vCPU and 5.5 GiB with the bundled OpenBao; volumes
# about 56 GiB. Requests on each node with your own OpenBao: about 0.3 vCPU
# and 1.6 GiB (31 % of the CPU and 36 % of the memory of the allocatable).
#
# Grow it with the use: when the requests of a node pass about 70 %, or the
# CPU is often throttled, raise the requests here or use larger nodes.
#
# The worker groups are a map: this file changes the fields of the two
# groups of values.yaml that it names.
api:
  replicas: 2
  resources: {requests: {cpu: 50m, memory: 160Mi}, limits: {memory: 512Mi}}
  webhook:
    replicas: 1
    resources: {requests: {cpu: 15m, memory: 64Mi}, limits: {memory: 256Mi}}
gateway:
  replicas: 2
  resources: {requests: {cpu: 25m, memory: 96Mi}, limits: {memory: 512Mi}}
organisationWallet:
  service:
    replicas: 2
    resources: {requests: {cpu: 100m, memory: 448Mi}, limits: {memory: 1Gi}}
  config:
    replicas: 2
    resources: {requests: {cpu: 25m, memory: 320Mi}, limits: {memory: 1Gi}}
  clock:
    replicas: 2
    resources: {requests: {cpu: 10m, memory: 160Mi}, limits: {memory: 384Mi}}
  workers:
    groups:
      main:
        queues: [realtime, attestation, status, kms]
        replicas: 1
        processes: 1
        threads: 8
        shutdownTimeoutSeconds: 600
        resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 1536Mi}}
      maintenance:
        queues: [maintenance]
        replicas: 1
        processes: 1
        threads: 2
        shutdownTimeoutSeconds: 14400
        resources: {requests: {cpu: 20m, memory: 256Mi}, limits: {memory: 1536Mi}}
enterpriseDashboard:
  replicas: 2
database:
  # The bundled PostgreSQL (shared_buffers 192MB): 1 GiB is enough for this size.
  resources: {requests: {cpu: 100m, memory: 1Gi}, limits: {cpu: "1", memory: 2Gi}}
  persistence: {size: 20Gi}
nats:
  persistence: {size: 5Gi}
openbao:
  resources: {requests: {cpu: 50m, memory: 256Mi}, limits: {memory: 1536Mi}}
  persistence: {size: 5Gi}
redis:
  resources: {requests: {cpu: 30m, memory: 96Mi}, limits: {memory: 512Mi}}
  persistence: {size: 2Gi}
