# Your own Valkey or Redis (redis.mode external) instead of the bundled
# Valkey. It must meet the requirements in docs/redis.md: Valkey or Redis
# 7.2 or later, Sentinel or one primary with replicas (not Redis Cluster),
# TLS, maxmemory-policy noeviction, AOF everysec, min-replicas-to-write 1,
# and the ACL users below with the rights from docs/redis.md.
#
# Before the install, create one Secret per user with its password
# (letters, digits and . _ ~ + / = -), and a Secret with the CA of your
# servers, for example:
#   kubectl -n ows create secret generic ows-redis-wallet-service --from-file=password=./wallet-service-password
#   kubectl -n ows create secret generic ows-redis-ca --from-file=ca.crt=./redis-ca.crt
redis:
  mode: external
  masterName: ows
  external:
    # Your group's Sentinels (or "address" for one primary without
    # Sentinel). The certificates must name these hosts, and the primary
    # and replica hosts that the Sentinels return.
    sentinels:
      - redis-1.example.org:26379
      - redis-2.example.org:26379
      - redis-3.example.org:26379
    # true: the processes log in to the Sentinels with their ACL user.
    sentinelAuth: true
    caSecret: ows-redis-ca
    caKey: ca.crt
  users:
    walletService: {username: wallet-service, passwordSecret: ows-redis-wallet-service, passwordKey: password}
    walletConfig: {username: wallet-config, passwordSecret: ows-redis-wallet-config, passwordKey: password}
    walletWorker: {username: wallet-worker, passwordSecret: ows-redis-wallet-worker, passwordKey: password}
    walletClock: {username: wallet-clock, passwordSecret: ows-redis-wallet-clock, passwordKey: password}
    gateway: {username: gateway, passwordSecret: ows-redis-gateway, passwordKey: password}
# With network policies (profiles/network-policies.yaml): the addresses of
# your servers and Sentinels.
networkPolicy:
  externalRedis:
    - hosts: [redis-1.example.org, redis-2.example.org, redis-3.example.org]
      cidrs: [192.0.2.50/32, 192.0.2.51/32, 192.0.2.52/32]
      ports: [6379, 26379]
