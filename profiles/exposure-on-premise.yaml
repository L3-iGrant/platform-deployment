# On-premise exposure with ingress-nginx: only the wallet host is public
# (docs/exposure.md, "On-premise installation"). It uses two ingress-nginx
# controllers: the public one (IngressClass nginx, namespace ingress-nginx)
# and an internal one on your internal network (IngressClass
# nginx-internal, namespace ingress-nginx-internal). Every host uses the
# internal IngressClass except the wallet host. The Service
# <fullname>-wallet-config has no route. The TLS Secrets (type
# kubernetes.io/tls) are yours, in the release namespace.
exposure:
  type: ingress
  ingress:
    className: nginx-internal
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 16m
api:
  # Internal: for the admins and the dashboard on the internal network.
  exposure:
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3900"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3900"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
    tls:
      secretName: api-tls
organisationWallet:
  # Public: the wallet's public routes (the service role), for example
  # the wallet unit flow of the phone apps.
  exposure:
    className: nginx
    tls:
      secretName: wallet-tls
enterpriseDashboard:
  # Internal.
  exposure:
    tls:
      secretName: dashboard-tls
# Both controllers set X-Real-IP to their TCP peer's address and overwrite
# any value that the client sends.
clientAddress:
  header: X-Real-IP
networkPolicy:
  # The pods of both controllers: the only source for the gateway, wallet
  # service and dashboard pods.
  ingressController:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [ingress-nginx, ingress-nginx-internal]
    podSelector: {}
