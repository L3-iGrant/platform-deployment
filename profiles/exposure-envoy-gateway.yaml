# Exposure with Envoy Gateway (Gateway API): one HTTPRoute per public host,
# attached to your Gateway. TLS ends at the Gateway (its listener holds the
# certificate). Envoy streams server-sent events and does not limit the
# body size of a route; the api route gets a request timeout above the
# longest stream (3900 s).
#
# Client address (for rate limits and the API key IP allow-list): with the
# policy below, your Gateway sets X-Real-IP to the client address and
# overwrites any value that a client sends. Without this policy, do NOT set
# clientAddress.header (a client could then pick its own address); the
# services then see an Envoy pod address for every client. If a load
# balancer sits in front of Envoy, it must pass on the client address too
# (for example with the load balancer's PROXY protocol and
# `proxyProtocol: {}` in the same policy).
#   apiVersion: gateway.envoyproxy.io/v1alpha1
#   kind: ClientTrafficPolicy
#   metadata: {name: platform-client-address, namespace: envoy-gateway-system}
#   spec:
#     targetRefs: [{group: gateway.networking.k8s.io, kind: Gateway, name: platform}]
#     headers:
#       earlyRequestHeaders:
#         set:
#           - name: X-Real-IP
#             value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
exposure:
  type: gatewayAPI
  gatewayAPI:
    parentRefs:
      - name: platform                     # your Gateway
        namespace: envoy-gateway-system
        sectionName: https                 # its HTTPS listener
    # A request may take up to 60 s, as the auth gateway allows (the proxy
    # default is 15 s; ingress-nginx waits 60 s). The api route waits
    # longer (below).
    timeouts:
      request: 60s
api:
  exposure:
    timeouts:
      request: 3900s
clientAddress:
  header: X-Real-IP                        # set by the policy above
networkPolicy:
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: envoy-gateway-system
    podSelector: {}
