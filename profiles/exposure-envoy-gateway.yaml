# Exposure with Envoy Gateway (Gateway API), the default exposure: one
# HTTPRoute per public host, attached to the HTTPS listener of the Gateway
# platform. TLS ends at the Gateway (its listener holds the certificate).
# Envoy streams server-sent events and does not limit the body size of a
# route; the api route gets a request timeout above the longest stream
# (3900 s).
#
# manifests/envoy-gateway/ has the Gateway and its objects, ready to apply
# (docs/prerequisites.md, "Envoy Gateway"): the GatewayClass, the Gateway
# platform in envoy-gateway-system, the redirect to HTTPS, the certificate
# from cert-manager, and the ClientTrafficPolicy that sets X-Real-IP to the
# client address and overwrites any value that a client sends. Without that
# policy, do NOT set clientAddress.header (a client could then pick its own
# address); the services then see an Envoy pod address for every client.
#
# Network policies: the chart defaults (networkPolicy.ingressController and
# networkPolicy.egress.profiles.platform) select the Envoy pods of this
# Gateway and their ports 10080 and 10443 (docs/network-policies.md).
exposure:
  type: gatewayAPI
  gatewayAPI:
    parentRefs:
      - name: platform                     # your Gateway
        namespace: envoy-gateway-system
        sectionName: https                 # its HTTPS listener
    # A request may take up to 60 s, as the auth gateway allows (the proxy
    # default is 15 s; ingress-nginx waits 60 s). The api route waits
    # longer (below).
    timeouts:
      request: 60s
api:
  exposure:
    timeouts:
      request: 3900s
clientAddress:
  header: X-Real-IP                        # set by manifests/envoy-gateway/03-client-traffic-policy.yaml
