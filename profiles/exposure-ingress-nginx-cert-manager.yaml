# ingress-nginx was retired on 24 March 2026 and gets no security fixes. Use
# it only on a cluster that still runs it; the default exposure is Envoy
# Gateway (exposure-envoy-gateway.yaml).
#
# Exposure with ingress-nginx, with TLS certificates from your cert-manager
# (optional: the chart creates no cert-manager objects). cert-manager reads
# the annotation and creates the TLS Secret of each host.
exposure:
  type: ingress
  ingress:
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 16m
      cert-manager.io/cluster-issuer: letsencrypt-prod   # your ClusterIssuer
api:
  exposure:
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3900"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3900"
      nginx.ingress.kubernetes.io/proxy-buffering: "off"
    tls:
      secretName: api-tls
organisationWallet:
  exposure:
    tls:
      secretName: wallet-tls
enterpriseDashboard:
  exposure:
    tls:
      secretName: dashboard-tls
clientAddress:
  header: X-Real-IP
networkPolicy:
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      matchLabels: null                    # removes the default labels (the Envoy pods)
  egress:
    profiles:
      platform:
        ports: [80, 443]                   # the container ports of ingress-nginx
