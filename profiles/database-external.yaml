# Database: your own PostgreSQL server. The init hook creates the databases
# and users with the admin user, and the roles hook uses it to create the
# wallet database roles; the components verify the server with its CA.
# Create the two Secrets first:
#   kubectl -n ows create secret generic db-admin --from-file=password=./db-admin-password.txt
#   kubectl -n ows create secret generic db-ca --from-file=ca.crt=./db-ca.crt
database:
  engine: postgresql
  mode: external
  external:
    host: db.example.org
    port: ""                 # empty means 5432
    admin:
      user: igrant_admin     # CREATEROLE and CREATEDB (see docs/database.md)
      passwordSecret: db-admin
      passwordKey: password
  tls:
    caSecret: db-ca
    caKey: ca.crt
