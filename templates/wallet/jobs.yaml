{{- /*
Read access hooks of the wallet (readAccess.jobs; helm post-install and
pre-upgrade, after the migration hook, so the views exist): "read-access
apply" for each enabled reader, api and consent
(ow.readAccess.enabledReaders). The command connects as the admin user
(readAccess.jobs.wallet, else ow.db.admin). Its config has only the
database, with the admin user and its password file (a pre-upgrade hook
cannot read the release's new ConfigMaps). The hooks run on every install
and upgrade (idempotent; a new release can add views).
*/}}
{{- $readers := include "ow.readAccess.enabledReaders" (list . (list "api" "consent")) | splitList "," | compact }}
{{- if and .Values.organisationWallet.enabled .Values.readAccess.jobs.enabled $readers }}
{{- $w := .Values.organisationWallet }}
{{- $admin := include "ow.readAccess.admin" (list . "wallet") | fromJson }}
{{- $name := include "ow.name" (list . "wallet-read-access") }}
{{- $configDir := "/etc/eudi-wallet-read-access" }}
{{- $secretDir := include "ow.wallet.secretDir" . }}
{{- $jobPod := deepCopy $w }}
{{- $_ := set $jobPod "podSecurityContext" ($w.jobs.podSecurityContext | default $w.podSecurityContext) }}
{{- $_ := set $jobPod "containerSecurityContext" ($w.jobs.containerSecurityContext | default $w.containerSecurityContext) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "wallet-read-access") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  config.yaml: |
    {{- include "ow.wallet.hookConfig" (list . $admin.user "database-admin-password") | nindent 4 }}
{{- range $reader := $readers }}
{{- $user := include "ow.readAccess.reader" (list $ $reader "wallet") | fromJson }}
{{- $component := printf "wallet-read-access-%s" $reader }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "ow.name" (list $ $component) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ow.labels" (list $ $component) | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: {{ $.Values.readAccess.jobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "ow.labels" (list $ $component) | nindent 8 }}
        {{- include "ow.netpol.labels" (list $ "job" list) | nindent 8 }}
    spec:
      # OnFailure retries by restarting the container in the same pod. With
      # network policies, a new pod's first connection can fail until the
      # policy controller knows the pod; a retry in a new pod (Never) would
      # hit the same delay every time.
      restartPolicy: OnFailure
      # The Job does not call the Kubernetes API.
      automountServiceAccountToken: false
      {{- include "ow.podSpecCommon" (list $ $jobPod) | nindent 6 }}
      containers:
        - name: command
          image: {{ include "ow.image" (list $ $w.image) }}
          imagePullPolicy: {{ include "ow.imagePullPolicy" (list $ $w.image) }}
          # The passwords of the new read-only user (--password-file) and
          # the admin user (--admin-password-file) are files from their
          # Secrets, never arguments or environment variables.
          command:
            {{- toYaml (list "/app/.venv/bin/read-access" "apply" "--reader" $reader "--user" $user.username "--password-file" "/run/secrets/read-access/password" "--admin-user" $admin.user "--admin-password-file" (printf "%s/database-admin-password" $secretDir)) | nindent 12 }}
          env:
            - name: EUDI_WALLET_CONFIG
              value: {{ printf "%s/config.yaml" $configDir }}
          {{- include "ow.containerSecurityContext" (list $ $jobPod) | nindent 10 }}
          {{- with $w.jobs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ $configDir }}
              readOnly: true
            - name: secrets
              mountPath: {{ $secretDir }}
              readOnly: true
            - name: read-access
              mountPath: /run/secrets/read-access
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              {{- range $path, $file := include "ow.wallet.databaseFiles" (list $ "database-admin-password" (dict "secret" $admin.secret "key" $admin.key)) | fromJson }}
              - secret:
                  name: {{ $file.secret }}
                  items:
                    - key: {{ $file.key }}
                      path: {{ $path }}
              {{- end }}
        - name: read-access
          secret:
            secretName: {{ $user.secret }}
            defaultMode: 0440
            items:
              - key: {{ $user.key }}
                path: password
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
{{- end }}
{{- end }}
