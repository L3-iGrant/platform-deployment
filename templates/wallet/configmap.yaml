{{- if .Values.organisationWallet.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ow.name" (list . "wallet") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "wallet") | nindent 4 }}
data:
  # Each wallet Deployment mounts its key as /etc/eudi-wallet/config.yaml:
  # <role>.yaml, and worker-<group>.yaml for each worker group. No secrets
  # here.
  {{- $files := list (dict "key" "service.yaml" "role" "service") (dict "key" "config.yaml" "role" "config") }}
  {{- range $g := .Values.organisationWallet.workers.groups }}
  {{- $files = append $files (dict "key" (printf "worker-%s.yaml" $g.name) "role" "worker" "group" $g) }}
  {{- end }}
  {{- $files = append $files (dict "key" "clock.yaml" "role" "clock") }}
  {{- range $file := $files }}
  {{ $file.key }}: |
    {{- if ne $file.role "clock" }}
    # kms.vault: the login of the wallet to OpenBao (the Transit engine).
    {{- end }}
    {{- include "ow.wallet.config" (dict "root" $ "role" $file.role "group" $file.group) | nindent 4 }}
  {{- end }}
{{- end }}
