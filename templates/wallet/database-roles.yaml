{{- /*
Roles hook of the organisation wallet (helm post-install and pre-upgrade,
before the migration hook): "database-roles apply" with the admin user of
the database server (ow.db.admin). It makes the database roles of the wallet
(<prefix>_owner, <prefix>_migrator and the roles of the processes; the
prefix is the wallet database name) with the passwords of the role Secret,
gives the objects of the wallet database to <prefix>_owner, makes the
missing data scope schemas and gives the grants. The command is idempotent.

Its configuration has only the database, with the admin user and its
password file (a pre-upgrade hook cannot read the new ConfigMaps of the
release). The admin password is a file of this hook only: no wallet pod and
no other wallet Job mounts it, and no wallet pod or Job mounts the password
of the database owner user.

It runs after the init hook (templates/database/init.yaml, weight -28 and
-27), which waits for the server and makes the wallet database and its
owner user, on a new installation and on an upgrade. A failed run stops the
install or the upgrade, as a failed migration hook does: the log of its pod
has the message of database-roles.
*/}}
{{- if .Values.organisationWallet.enabled }}
{{- $w := .Values.organisationWallet }}
{{- $admin := include "ow.db.admin" . | fromJson }}
{{- $name := include "ow.name" (list . "wallet-database-roles") }}
{{- $configDir := "/etc/eudi-wallet-database-roles" }}
{{- $secretDir := include "ow.wallet.secretDir" . }}
{{- $rolesDir := "/run/secrets/database-roles" }}
{{- $jobPod := deepCopy $w }}
{{- $_ := set $jobPod "podSecurityContext" ($w.jobs.podSecurityContext | default $w.podSecurityContext) }}
{{- $_ := set $jobPod "containerSecurityContext" ($w.jobs.containerSecurityContext | default $w.containerSecurityContext) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "wallet-database-roles") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-25"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  config.yaml: |
    {{- include "ow.wallet.hookConfig" (list . $admin.user "database-admin-password") | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "wallet-database-roles") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: {{ $w.jobs.ttlSecondsAfterFinished | default 86400 }}
  template:
    metadata:
      labels:
        {{- include "ow.labels" (list . "wallet-database-roles") | nindent 8 }}
        {{- include "ow.netpol.labels" (list . "job" list) | nindent 8 }}
    spec:
      restartPolicy: Never
      # The Job does not call the Kubernetes API.
      automountServiceAccountToken: false
      {{- include "ow.podSpecCommon" (list . $jobPod) | nindent 6 }}
      containers:
        - name: database-roles
          image: {{ include "ow.image" (list . $w.image) }}
          imagePullPolicy: {{ include "ow.imagePullPolicy" (list . $w.image) }}
          # The passwords are files: --password-dir has one file per login
          # role (the key of the role Secret), --admin-password-file the
          # password of the admin user.
          command:
            {{- toYaml (list "/app/.venv/bin/database-roles" "apply" "--password-dir" $rolesDir "--admin-user" $admin.user "--admin-password-file" (printf "%s/database-admin-password" $secretDir)) | nindent 12 }}
          env:
            - name: EUDI_WALLET_CONFIG
              value: {{ printf "%s/config.yaml" $configDir }}
          {{- include "ow.containerSecurityContext" (list . $jobPod) | nindent 10 }}
          {{- with $w.jobs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ $configDir }}
              readOnly: true
            - name: secrets
              mountPath: {{ $secretDir }}
              readOnly: true
            - name: database-roles
              mountPath: {{ $rolesDir }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              {{- range $path, $file := include "ow.wallet.databaseFiles" (list . "database-admin-password" (dict "secret" $admin.secret "key" $admin.key)) | fromJson }}
              - secret:
                  name: {{ $file.secret }}
                  items:
                    - key: {{ $file.key }}
                      path: {{ $path }}
              {{- end }}
        - name: database-roles
          secret:
            secretName: {{ include "ow.wallet.databaseRolesSecretName" . }}
            defaultMode: 0440
            items:
              {{- range $role := include "ow.wallet.databaseLogins" . | splitList "," }}
              - key: {{ $role }}
                path: {{ $role }}
              {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
{{- end }}
