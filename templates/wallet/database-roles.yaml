{{- /*
Roles hook of the organisation wallet (helm post-install and pre-upgrade,
before the migration hook): runs "database-roles apply" as the admin user
of the database server (ow.db.admin). It creates the wallet database roles
(<prefix>_owner, <prefix>_migrator and the process roles; the prefix is the
wallet database name) with the passwords from the role Secret, hands the
wallet database objects to <prefix>_owner, creates any missing data scope
schemas and applies the grants. The command is idempotent.

Its config has only the database, with the admin user and its password file
(a pre-upgrade hook cannot read the release's new ConfigMaps). Only this
hook mounts the admin password: no wallet pod or other wallet Job does, and
no wallet pod or Job mounts the password of the database owner user.

It runs after the init hook (templates/database/init.yaml, weights -28 and
-27), which waits for the server and creates the wallet database and its
owner user, on a new installation and on an upgrade. A failed run stops the
install or upgrade, like a failed migration hook; its pod log shows the
database-roles message.
*/}}
{{- if .Values.organisationWallet.enabled }}
{{- $w := .Values.organisationWallet }}
{{- $admin := include "ow.db.admin" . | fromJson }}
{{- $name := include "ow.name" (list . "wallet-database-roles") }}
{{- $configDir := "/etc/eudi-wallet-database-roles" }}
{{- $secretDir := include "ow.wallet.secretDir" . }}
{{- $rolesDir := "/run/secrets/database-roles" }}
{{- $jobPod := deepCopy $w }}
{{- $_ := set $jobPod "podSecurityContext" ($w.jobs.podSecurityContext | default $w.podSecurityContext) }}
{{- $_ := set $jobPod "containerSecurityContext" ($w.jobs.containerSecurityContext | default $w.containerSecurityContext) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "wallet-database-roles") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-25"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  config.yaml: |
    {{- include "ow.wallet.hookConfig" (list . $admin.user "database-admin-password") | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "wallet-database-roles") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # With OnFailure this counts container restarts: 3 gives two retries.
  backoffLimit: 3
  ttlSecondsAfterFinished: {{ $w.jobs.ttlSecondsAfterFinished | default 86400 }}
  template:
    metadata:
      labels:
        {{- include "ow.labels" (list . "wallet-database-roles") | nindent 8 }}
        {{- include "ow.netpol.labels" (list . "job" list) | nindent 8 }}
    spec:
      # OnFailure retries by restarting the container in the same pod. With
      # network policies, a new pod's first connection can fail until the
      # policy controller knows the pod; a retry in a new pod (Never) would
      # hit the same delay every time.
      restartPolicy: OnFailure
      # The Job does not call the Kubernetes API.
      automountServiceAccountToken: false
      {{- include "ow.podSpecCommon" (list . $jobPod) | nindent 6 }}
      containers:
        - name: database-roles
          image: {{ include "ow.image" (list . $w.image) }}
          imagePullPolicy: {{ include "ow.imagePullPolicy" (list . $w.image) }}
          # Passwords are files: --password-dir has one file per login role
          # (its key in the role Secret), and --admin-password-file holds
          # the admin user's password.
          command:
            {{- toYaml (list "/app/.venv/bin/database-roles" "apply" "--password-dir" $rolesDir "--admin-user" $admin.user "--admin-password-file" (printf "%s/database-admin-password" $secretDir)) | nindent 12 }}
          env:
            - name: EUDI_WALLET_CONFIG
              value: {{ printf "%s/config.yaml" $configDir }}
          {{- include "ow.containerSecurityContext" (list . $jobPod) | nindent 10 }}
          {{- with $w.jobs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ $configDir }}
              readOnly: true
            - name: secrets
              mountPath: {{ $secretDir }}
              readOnly: true
            - name: database-roles
              mountPath: {{ $rolesDir }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              {{- range $path, $file := include "ow.wallet.databaseFiles" (list . "database-admin-password" (dict "secret" $admin.secret "key" $admin.key)) | fromJson }}
              - secret:
                  name: {{ $file.secret }}
                  items:
                    - key: {{ $file.key }}
                      path: {{ $path }}
              {{- end }}
        - name: database-roles
          secret:
            secretName: {{ include "ow.wallet.databaseRolesSecretName" . }}
            defaultMode: 0440
            items:
              {{- range $role := include "ow.wallet.databaseLogins" . | splitList "," }}
              - key: {{ $role }}
                path: {{ $role }}
              {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
{{- end }}
