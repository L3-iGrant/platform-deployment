{{- if .Values.organisationWallet.enabled }}
{{- $w := .Values.organisationWallet }}
{{- $roles := list "service" "config" }}
{{- range $role := $roles }}
{{- $settings := index $w $role }}
{{- $component := printf "wallet-%s" $role }}
{{- /* The config pods verify the internal token of the gateway and the
signed NATS commands of the api; they mount the public keys of both. */}}
{{- $gatewayKeys := eq $role "config" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ow.name" (list $ $component) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ow.labels" (list $ $component) | nindent 4 }}
spec:
  replicas: {{ $settings.replicas }}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "ow.selectorLabels" (list $ $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ow.labels" (list $ $component) | nindent 8 }}
        {{- include "ow.netpol.labels" (list $ $component list) | nindent 8 }}
      annotations:
        {{- include "ow.checksum" (list "config" (include "ow.wallet.config" (dict "root" $ "role" $role))) | nindent 8 }}
        {{- include "ow.checksum" (list "secrets" (list (include "ow.wallet.secretFiles" (list $ $role)) $.Values.openbao.wallet $.Values.openbao.external $.Values.database.databases.wallet)) | nindent 8 }}
        {{- include "ow.checksum" (list "keys" (list $.Values.gateway.publicKeys $.Values.serviceKeys $w.serviceEnvelope (index $.Values.nats.auth.users (include "ow.wallet.natsUser" $role)) (include "ow.nats.ca" $) (ternary $.Values.readAccess.wallet dict (eq $role "config")))) | nindent 8 }}
    spec:
      {{- include "ow.podSpecCommon" (list $ $w) | nindent 6 }}
      {{- /* The service and config pods: the stop budget of
      organisationWallet.server (ow.wallet.checkServer). */}}
      terminationGracePeriodSeconds: {{ $w.server.terminationGracePeriodSeconds | int }}
      containers:
        - name: {{ $component }}
          image: {{ include "ow.image" (list $ $w.image) }}
          imagePullPolicy: {{ include "ow.imagePullPolicy" (list $ $w.image) }}
          # The full command: the image has no entrypoint script.
          command: ["/app/.venv/bin/start-server"]
          env:
            # The only environment variable of the wallet configuration: the
            # path of the file (the image has the same default).
            - name: EUDI_WALLET_CONFIG
              value: {{ include "ow.wallet.configPath" $ | quote }}
            {{- with $w.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            # The Prometheus metrics of the server (/metrics only): the
            # monitoring namespace scrapes it; no Service of the routes and
            # no Ingress has it.
            - name: metrics
              containerPort: {{ include "ow.wallet.serverMetricsPort" $ }}
          # The server answers /healthz only when the database schema is at
          # the head of its code: it waits up to 600 s (on a new
          # installation the post-install hooks migrate while the pods
          # start), then stops, and Kubernetes starts it again. The startup
          # probe covers the wait: 5 s x 130 = 650 s.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 130
          # Liveness: /healthz (the process runs; it never waits for a
          # dependency after the start). Readiness: /readyz (the config role
          # waits for the api and consent views).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sleep", {{ $w.server.preStopSeconds | int | toString | quote }}]
          {{- include "ow.containerSecurityContext" (list $ $w) | nindent 10 }}
          {{- with $settings.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "ow.wallet.volumeMounts" $ | nindent 12 }}
            {{- with include "ow.wallet.trustAnchorsMount" (list $ $role) }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: server-metrics
              mountPath: {{ include "ow.wallet.serverMetricsDir" $ }}
            - name: tmp
              mountPath: /tmp
            {{- if $gatewayKeys }}
            - name: gateway-keys
              mountPath: {{ include "ow.gateway.keysDir" $ }}
              readOnly: true
            - name: service-keys
              mountPath: {{ include "ow.serviceKeys.dir" $ }}
              readOnly: true
            {{- end }}
      volumes:
        {{- include "ow.wallet.volumes" (list $ $role) | nindent 8 }}
        {{- with include "ow.wallet.trustAnchorsVolume" (list $ $role) }}
        {{- . | nindent 8 }}
        {{- end }}
        # The metrics files of the processes of the server
        # (server.metrics_directory).
        - name: server-metrics
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        # The temporary files of Python (tempfile; the root file system is
        # read-only), for example a part of a multipart form that is larger
        # than 1 MB.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- if $gatewayKeys }}
        {{- include "ow.gateway.keysVolume" $ | nindent 8 }}
        {{- include "ow.serviceKeys.volume" (list $ "igrant-api") | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
