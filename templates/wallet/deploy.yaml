{{- if .Values.organisationWallet.enabled }}
{{- $w := .Values.organisationWallet }}
{{- $roles := list "service" "config" }}
{{- range $role := $roles }}
{{- $settings := index $w $role }}
{{- $component := printf "wallet-%s" $role }}
{{- /* The config pods verify the gateway's internal token and the api's
signed NATS commands, so they mount the public keys of both. */}}
{{- $gatewayKeys := eq $role "config" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ow.name" (list $ $component) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ow.labels" (list $ $component) | nindent 4 }}
spec:
  replicas: {{ $settings.replicas }}
  {{- include "ow.rollout" $w | nindent 2 }}
  selector:
    matchLabels:
      {{- include "ow.selectorLabels" (list $ $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ow.labels" (list $ $component) | nindent 8 }}
        {{- include "ow.netpol.labels" (list $ $component list) | nindent 8 }}
      annotations:
        {{- include "ow.checksum" (list "config" (include "ow.wallet.config" (dict "root" $ "role" $role))) | nindent 8 }}
        {{- include "ow.checksum" (list "secrets" (list (include "ow.wallet.secretFiles" (list $ $role)) $.Values.openbao.wallet $.Values.openbao.external $.Values.database.databases.wallet)) | nindent 8 }}
        {{- include "ow.checksum" (list "keys" (list $.Values.gateway.publicKeys $.Values.serviceKeys $w.serviceEnvelope (index $.Values.nats.auth.users (include "ow.wallet.natsUser" $role)) (include "ow.nats.ca" $) (ternary $.Values.readAccess.wallet dict (eq $role "config")))) | nindent 8 }}
    spec:
      {{- include "ow.podSpecCommon" (list $ $w) | nindent 6 }}
      {{- /* Service and config pods: the stop budget from
      organisationWallet.server (ow.wallet.checkServer). */}}
      terminationGracePeriodSeconds: {{ $w.server.terminationGracePeriodSeconds | int }}
      containers:
        - name: {{ $component }}
          image: {{ include "ow.image" (list $ $w.image) }}
          imagePullPolicy: {{ include "ow.imagePullPolicy" (list $ $w.image) }}
          # The full command: the image has no entrypoint script.
          command: ["/app/.venv/bin/start-server"]
          env:
            # The only wallet config environment variable: the file path
            # (the image has the same default).
            - name: EUDI_WALLET_CONFIG
              value: {{ include "ow.wallet.configPath" $ | quote }}
            {{- with $w.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
            # Server Prometheus metrics (/metrics only), scraped from the
            # monitoring namespace; no route Service and no Ingress exposes
            # this port.
            - name: metrics
              containerPort: {{ include "ow.wallet.serverMetricsPort" $ }}
          # The server only answers /healthz once the database schema is at
          # its code's head. It waits up to 600 s (on a new installation the
          # post-install hooks migrate while the pods start), then exits and
          # Kubernetes restarts it. The startup probe covers the wait:
          # 5 s x 130 = 650 s.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 130
          # Liveness: /healthz (the process is up; after start it never
          # waits for a dependency). Readiness: /readyz (the config role
          # waits for the api and consent views).
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          # The preStop sleep (the sleep action, as the image has no shell or
          # sleep program), then SIGTERM: the server waits for its requests
          # and background tasks (ow.wallet.checkServer).
          {{- include "ow.preStopSleep" $w.server.preStopSeconds | nindent 10 }}
          {{- include "ow.containerSecurityContext" (list $ $w) | nindent 10 }}
          {{- with $settings.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- include "ow.wallet.volumeMounts" $ | nindent 12 }}
            {{- with include "ow.wallet.trustAnchorsMount" (list $ $role) }}
            {{- . | nindent 12 }}
            {{- end }}
            - name: server-metrics
              mountPath: {{ include "ow.wallet.serverMetricsDir" $ }}
            - name: tmp
              mountPath: /tmp
            {{- if $gatewayKeys }}
            - name: gateway-keys
              mountPath: {{ include "ow.gateway.keysDir" $ }}
              readOnly: true
            - name: service-keys
              mountPath: {{ include "ow.serviceKeys.dir" $ }}
              readOnly: true
            {{- end }}
      volumes:
        {{- include "ow.wallet.volumes" (list $ $role) | nindent 8 }}
        {{- with include "ow.wallet.trustAnchorsVolume" (list $ $role) }}
        {{- . | nindent 8 }}
        {{- end }}
        # Metrics files of the server processes (server.metrics_directory).
        - name: server-metrics
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        # Python temp files (tempfile; the root file system is read-only),
        # for example a multipart form part larger than 1 MB.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- if $gatewayKeys }}
        {{- include "ow.gateway.keysVolume" $ | nindent 8 }}
        {{- include "ow.serviceKeys.volume" (list $ "igrant-api") | nindent 8 }}
        {{- end }}
{{- end }}
{{- end }}
