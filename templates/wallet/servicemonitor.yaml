{{- /*
ServiceMonitor for /metrics of the servers, the workers and the clock
(organisationWallet.serviceMonitor.enabled; the Prometheus Operator CRD
must exist; docs/workers.md). Headless Services for the service and config
roles (port metrics), each worker group and the clock (port health) expose
the pods as targets, including pods that are not ready (a worker is not
ready while Valkey does not answer, and its metrics show that). Each
Service's metrics.igrant.io/job label sets the job of its targets:
wallet-server, wallet-worker, wallet-clock (the job names that the
alert rules of the wallet use).
*/}}
{{- if and .Values.organisationWallet.enabled .Values.organisationWallet.serviceMonitor.enabled }}
{{- $w := .Values.organisationWallet }}
{{- $metrics := include "ow.wallet.serverMetricsPort" . | int }}
{{- $targets := list
  (dict "name" "wallet-service-metrics" "pods" "wallet-service" "port" $metrics "portName" "metrics" "job" "wallet-server")
  (dict "name" "wallet-config-metrics" "pods" "wallet-config" "port" $metrics "portName" "metrics" "job" "wallet-server")
  (dict "name" "wallet-clock" "pods" "wallet-clock" "port" (include "ow.wallet.clockHealthPort" . | int) "portName" "health" "job" "wallet-clock") }}
{{- range $g := $w.workers.groups }}
{{- $component := include "ow.wallet.workerComponent" $g }}
{{- $targets = append $targets (dict "name" $component "pods" $component "port" (include "ow.wallet.workerHealthPort" $ | int) "portName" "health" "job" "wallet-worker") }}
{{- end }}
{{- range $target := $targets }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ow.name" (list $ $target.name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "ow.labels" (list $ $target.name) | nindent 4 }}
    metrics.igrant.io/job: {{ $target.job }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: {{ $target.portName }}
      port: {{ $target.port }}
      targetPort: {{ $target.portName }}
  selector:
    {{- include "ow.selectorLabels" (list $ $target.pods) | nindent 4 }}
---
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ow.name" (list . "wallet-metrics") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "wallet-metrics") | nindent 4 }}
    {{- with $w.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: metrics.igrant.io/job
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ow.chartName" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          {{- range $target := $targets }}
          - {{ $target.name }}
          {{- end }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $w.serviceMonitor.interval }}
    - port: health
      path: /metrics
      interval: {{ $w.serviceMonitor.interval }}
{{- end }}
