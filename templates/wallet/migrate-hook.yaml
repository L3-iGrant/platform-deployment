{{- /*
Migration hook of the organisation wallet (ow.migrateHook, helm
post-install and pre-upgrade, after the roles hook): runs "migrate-database"
(the wallet migrations with the read-only user views, then the grant step)
as the migrator <prefix>_migrator, before any Deployment of the release
changes. The migrator is a member of the owner role, so the migrations
create objects as <prefix>_owner. On a new installation the hook runs after
the release's resources exist, and the wallet pods wait for the schema
head. Its config has only the database and the audit log retention
(ow.wallet.migrateConfig; the wallet reads the file named by
EUDI_WALLET_CONFIG). After the grant step, the partition step creates the
monthly audit event partitions and drops the months older than the
retention. It mounts only the migrator key of the role Secret.
*/}}
{{- if .Values.organisationWallet.enabled }}
{{- $password := dict "secret" (include "ow.wallet.databaseRolesSecretName" .) "key" "migrator" }}
{{- include "ow.migrateHook" (dict
  "root" .
  "hook" "post-install,pre-upgrade"
  "component" "wallet-migrate"
  "values" .Values.organisationWallet
  "jobs" .Values.organisationWallet.jobs
  "configPath" "/etc/eudi-wallet-migrate/config.yaml"
  "config" (include "ow.wallet.migrateConfig" (list . (include "ow.wallet.databaseUser" (list . "migrator")) "database-password"))
  "env" (list (dict "name" "EUDI_WALLET_CONFIG" "value" "/etc/eudi-wallet-migrate/config.yaml"))
  "steps" (list (dict "name" "migrate" "command" (list "/app/.venv/bin/migrate-database")))
  "secrets" (include "ow.migrateHook.secrets" (include "ow.wallet.databaseFiles" (list . "database-password" $password) | fromJson) | fromJsonArray)
  "secretDir" (include "ow.wallet.secretDir" .)) }}
{{- end }}
