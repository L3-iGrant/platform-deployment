{{- /*
Public JWKS for each service's signed NATS envelopes (no secrets):
receivers verify senders with them. The chart builds the ConfigMap from
serviceKeys.publicJwks when serviceKeys.existingConfigMap is empty. Each
service's private JWKS is its own Secret, created by the operator.
*/}}
{{- $keys := .Values.serviceKeys }}
{{- if not $keys.existingConfigMap }}
{{- $data := dict }}
{{- range $issuer, $jwks := $keys.publicJwks }}
{{- if $jwks }}
{{- $_ := set $data (printf "%s.json" $issuer) $jwks }}
{{- end }}
{{- end }}
{{- if $data }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ow.serviceKeys.configMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "service-keys") | nindent 4 }}
data:
  {{- range $file, $jwks := $data }}
  {{ $file }}: |
    {{- $jwks | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
