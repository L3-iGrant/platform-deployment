{{- /*
Public JWKS for each service's signed NATS envelopes (no secrets):
receivers verify senders with them. The chart builds the ConfigMap from
keys.serviceEnvelope.<component>.publicJwks (key <issuer>.json) when
keys.publicJwks.existingConfigMap is empty. Each service's private JWKS is
its own Secret (scripts/make-keys.sh).
*/}}
{{- $keys := .Values.keys }}
{{- if not $keys.publicJwks.existingConfigMap }}
{{- $data := dict }}
{{- range $component, $issuer := include "ow.serviceKeys.issuers" . | fromJson }}
{{- with (index $keys.serviceEnvelope $component).publicJwks }}
{{- $_ := set $data (printf "%s.json" $issuer) . }}
{{- end }}
{{- end }}
{{- if $data }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ow.serviceKeys.configMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "service-keys") | nindent 4 }}
data:
  {{- range $file, $jwks := $data }}
  {{ $file }}: |
    {{- $jwks | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
