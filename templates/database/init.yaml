{{- /*
The init hook of the databases: one database and one owner user for each
enabled component (the user name is the database name), with the password
of the database Secret, on the bundled server or on an external server with
database.external.admin. A hook (helm post-install and pre-upgrade), before
every hook that connects to a component database (the roles hook of the
wallet, weight -25 and -20; the migration hooks, -10 and -5): on a new
installation it runs after the resources of the release exist (the bundled
server too), and on an upgrade before any resource changes, so an upgrade
that turns a component on makes its database and its owner user before the
hooks of the component connect. It reads only the database Secret (a hook,
weight -30) and the CA of the server. The script is idempotent: it makes a
user or a database only when it does not exist, and it sets the password of
each user from the Secret each time: CREATE ROLE ... LOGIN, CREATE DATABASE ...
OWNER (UTF8, C.UTF-8), REVOKE ALL ON DATABASE ... FROM PUBLIC, then psql
\password (the server gets the SCRAM-SHA-256 verifier, never the password,
so its DDL log does not show the password). The data scopes of the wallet
are schemas in the wallet database, which its owner makes.
*/}}
{{- $admin := include "ow.db.admin" . | fromJson }}
{{- $keys := include "ow.db.enabledDatabases" . | splitList "," | compact }}
{{- if and $admin.user $keys }}
{{- include "ow.db.check" . }}
{{- $db := .Values.database }}
{{- $image := $db.postgresql.image }}
{{- $ca := include "ow.db.ca" . | fromJson }}
{{- $users := list }}
{{- range $key := $keys }}
{{- $users = append $users (index $db.databases $key).name }}
{{- end }}
{{- $name := include "ow.name" (list . "db-init") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "db-init") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-28"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  create-databases.sh: |
    #!/bin/bash
    # The passwords are files (/etc/db-users/<user>): they never go on a
    # command line.
    set -euo pipefail
    for attempt in $(seq 1 60); do
      if pg_isready -q; then
        break
      fi
      if [ "$attempt" -eq 60 ]; then
        echo "The database server is not ready after 300 seconds" >&2
        exit 1
      fi
      sleep 5
    done
    for user in ${DATABASES}; do
      echo "Configuring the user and the database ${user}"
      psql -v ON_ERROR_STOP=1 -d postgres -v role="${user}" <<'SQL'
    SELECT format('CREATE ROLE %I LOGIN', :'role')
      WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role') \gexec
    ALTER ROLE :"role" WITH LOGIN;
    SELECT format('CREATE DATABASE %I OWNER %I TEMPLATE template0 ENCODING %L LC_COLLATE %L LC_CTYPE %L',
                  :'role', :'role', 'UTF8', 'C', 'C.UTF-8')
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'role') \gexec
    REVOKE ALL ON DATABASE :"role" FROM PUBLIC;
    SQL
      # psql \password sends the SCRAM-SHA-256 verifier of the password, never
      # the password, so the DDL log of the server does not show it. psql
      # reads the password twice from its standard input (the Job has no
      # terminal); printf is a shell builtin, so the password is not on a
      # command line. The output (the two prompts) shows only on an error.
      password="$(< "/etc/db-users/${user}")"
      if ! output="$(printf '%s\n%s\n' "$password" "$password" \
          | psql -v ON_ERROR_STOP=1 -d postgres -v role="${user}" -c '\password :"role"' 2>&1)"; then
        printf '%s\n' "$output" >&2
        echo "The password of the user ${user} is not set" >&2
        exit 1
      fi
    done
    echo "All databases are configured"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "db-init") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-27"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  # On a new installation the bundled server starts with the release: the
  # script waits up to 300 s for it, and the pod runs again on a failure.
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "ow.labels" (list . "db-init") | nindent 8 }}
        {{- include "ow.netpol.labels" (list . "job" list) | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      # The Job does not call the Kubernetes API.
      automountServiceAccountToken: false
      {{- include "ow.podSpecCommon" (list . $db) | nindent 6 }}
      containers:
        - name: create-databases
          image: {{ include "ow.image" (list . $image) }}
          imagePullPolicy: {{ include "ow.imagePullPolicy" (list . $image) }}
          command: ["bash", "/scripts/create-databases.sh"]
          env:
            - name: PGHOST
              value: {{ include "ow.db.host" . | quote }}
            - name: PGPORT
              value: {{ include "ow.db.port" . | quote }}
            - name: PGUSER
              value: {{ $admin.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $admin.secret }}
                  key: {{ $admin.key }}
            - name: PGSSLMODE
              value: {{ include "ow.db.sslMode" . | quote }}
            {{- if $ca.secret }}
            - name: PGSSLROOTCERT
              value: /etc/db-ca/ca.crt
            {{- end }}
            # The user names; each user has a database with the same name.
            - name: DATABASES
              value: {{ $users | join " " | quote }}
            - name: HOME
              value: /tmp
          {{- include "ow.containerSecurityContext" (list . $db) | nindent 10 }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: users
              mountPath: /etc/db-users
              readOnly: true
            {{- if $ca.secret }}
            - name: ca
              mountPath: /etc/db-ca
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: {{ $name }}
        - name: users
          secret:
            secretName: {{ include "ow.db.secretName" . }}
            defaultMode: 0440
            items:
              {{- range $user := $users }}
              - key: {{ $user }}
                path: {{ $user }}
              {{- end }}
        {{- if $ca.secret }}
        - name: ca
          secret:
            secretName: {{ $ca.secret }}
            defaultMode: 0444
            items:
              - key: {{ $ca.key }}
                path: ca.crt
        {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
{{- end }}
