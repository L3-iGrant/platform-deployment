{{- $keys := .Values.keys.publicJwks }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ow.name" (list . "gateway") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "gateway") | nindent 4 }}
data:
  # The gateway mounts it as /etc/igrant-gateway/config.yaml. No secrets
  # here.
  config.yaml: |
    {{- include "ow.gateway.config" . | nindent 4 }}
  {{- /* Public keys for api tokens (only the gateway reads them), unless
  keys.publicJwks.existingConfigMap is set. */}}
  {{- if and (not $keys.existingConfigMap) $keys.apiTokenVerification }}
  token-verification-jwks.json: |
    {{- $keys.apiTokenVerification | nindent 4 }}
  {{- end }}
---
{{- /*
The shared ConfigMap <fullname>-igrant-gateway-jwks (no secrets): the
gateway public keys that the api core and the wallet config role mount. The
chart builds it from keys.publicJwks.gatewayInternalToken when
keys.publicJwks.existingConfigMap is empty.
*/}}
{{- if and (not $keys.existingConfigMap) $keys.gatewayInternalToken }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ow.gateway.publicKeysConfigMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "gateway") | nindent 4 }}
data:
  gateway-jwks.json: |
    {{- $keys.gatewayInternalToken | nindent 4 }}
{{- end }}
