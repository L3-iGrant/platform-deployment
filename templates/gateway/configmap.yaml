{{- $keys := .Values.gateway.publicKeys }}
{{- if .Values.api.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ow.name" (list . "gateway") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "gateway") | nindent 4 }}
data:
  # The gateway mounts it as /etc/igrant-gateway/config.yaml. No secrets
  # here.
  config.yaml: |
    {{- include "ow.gateway.config" . | nindent 4 }}
  {{- /* Public keys for api tokens (only the gateway reads them), unless
  gateway.publicKeys.existingTokenVerificationConfigMap is set. */}}
  {{- if and (not $keys.existingTokenVerificationConfigMap) $keys.tokenVerificationJwks }}
  {{ $keys.tokenVerificationJwksKey }}: |
    {{- $keys.tokenVerificationJwks | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- /*
The shared ConfigMap <fullname>-igrant-gateway-jwks (no secrets): the
gateway public keys that the api core, consent and the wallet config role
mount. The chart builds it from the values when
gateway.publicKeys.existingConfigMap is empty.
*/}}
{{- if and (not $keys.existingConfigMap) $keys.gatewayJwks }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ow.gateway.publicKeysConfigMap" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "gateway") | nindent 4 }}
data:
  {{ $keys.gatewayJwksKey }}: |
    {{- $keys.gatewayJwks | nindent 4 }}
{{- end }}
