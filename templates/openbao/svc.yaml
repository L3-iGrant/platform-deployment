{{- if include "ow.openbao.bundled" . }}
# Client Service: only unsealed (ready) pods. A standby node forwards every
# request to the active node (disable_standby_reads in openbao.hcl).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ow.openbao.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "openbao") | nindent 4 }}
spec:
  ports:
    - name: https
      port: 8200
      targetPort: https
  selector:
    {{- include "ow.selectorLabels" (list . "openbao") | nindent 4 }}
---
# Raft peers: the pod DNS names for retry_join, api_addr and cluster_addr,
# also before the pods are ready.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ow.openbao.headlessName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "openbao") | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: https
      port: 8200
      targetPort: https
    - name: cluster
      port: 8201
      targetPort: cluster
  selector:
    {{- include "ow.selectorLabels" (list . "openbao") | nindent 4 }}
{{- end }}
