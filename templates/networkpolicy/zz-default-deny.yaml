{{- /*
Default deny for the suite's pods (networkPolicy.enabled): no ingress and no
egress beyond what the allow policies in policies.yaml permit. Helm applies
NetworkPolicies in template file order and this file comes last, so the
allow policies exist first.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ow.name" (list . "netpol-default-deny") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "networkpolicy") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - {key: netpol.igrant.io/role, operator: Exists}
  policyTypes: [Ingress, Egress]
{{- end }}
