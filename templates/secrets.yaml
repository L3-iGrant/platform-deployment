{{- /*
All the Secrets that the chart makes. They are in one file, so that one
generated value is the same in each Secret that uses it.

Each value comes from values.yaml; else from the Secret of an earlier
release (lookup), so "helm upgrade" keeps it; else it is a new random value.
"helm template" cannot read the cluster, so it shows new random values.
The Secrets have helm.sh/resource-policy keep: they stay after "helm
uninstall", with the volumes, so that an install with the kept volumes uses
the same passwords, keys and certificates (docs/uninstall.md).

The Secrets that the database hooks read are hooks too (pre-install and
pre-upgrade, weight -30, before every other hook): the database Secret, the
read access Secret and the role Secret of the wallet. Helm makes the
resources of a release only after its pre-upgrade hooks, so an upgrade that
turns a component on has the passwords of its database, of its read-only
users and of its database roles before the init hook and the migration
hooks need them. before-hook-creation: Helm deletes the Secret of the
earlier release just before it makes this one, with the values that the
render read from it (lookup). keep: the first upgrade from a release in
which the Secret was a resource does not delete it (Helm reads the
annotation on the live Secret, which this hook made again). Helm never
deletes a hook, so these Secrets also stay after "helm uninstall".
*/ -}}
{{- $keys := include "ow.db.enabledDatabases" . | splitList "," | compact }}
{{- $bundled := include "ow.db.bundled" . }}

{{- /* Database passwords: the admin user of the bundled server and the owner
user of each component database (the user name is the database name). A
hook: the init hook and the migration hooks of the api and consent read
it. */}}
{{- if and (not .Values.database.auth.existingSecret) (or $bundled $keys) }}
{{- include "ow.db.check" . }}
{{- $dbSecret := include "ow.db.serverName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $dbSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
  labels:
    {{- include "ow.labels" (list . "database") | nindent 4 }}
type: Opaque
data:
  {{- if $bundled }}
  {{- $adminKey := include "ow.db.adminPasswordKey" . }}
  {{ $adminKey }}: {{ include "ow.secretValue" (list . .Values.database.auth.adminPassword $dbSecret $adminKey 32) | b64enc }}
  {{- end }}
  {{- range $key := $keys }}
  {{- $user := (index $.Values.database.databases $key).name }}
  {{ $user }}: {{ include "ow.secretValue" (list $ (index $.Values.database.databases $key).password $dbSecret $user 32) | b64enc }}
  {{- end }}
---
{{- end }}

{{- /* Certificate of the bundled server: a CA and a server certificate for
the Service names (10 years, kept across upgrades). The components verify
the server with ca.crt. */}}
{{- if and $bundled .Values.database.tls.enabled (not .Values.database.tls.existingSecret) }}
{{- $tlsSecret := include "ow.db.tlsSecretName" . }}
{{- $crt := include "ow.lookupSecretKey" (list . $tlsSecret "tls.crt") }}
{{- $key := include "ow.lookupSecretKey" (list . $tlsSecret "tls.key") }}
{{- $caCrt := include "ow.lookupSecretKey" (list . $tlsSecret "ca.crt") }}
{{- if not (and $crt $key $caCrt) }}
{{- $service := include "ow.db.serverName" . }}
{{- $ns := .Release.Namespace }}
{{- $ca := genCA (printf "%s-ca" $service) 3650 }}
{{- $cert := genSignedCert $service nil (list $service (printf "%s.%s" $service $ns) (printf "%s.%s.svc" $service $ns) (printf "%s.%s.svc.cluster.local" $service $ns)) 3650 $ca }}
{{- $crt = printf "%s%s" $cert.Cert $ca.Cert }}
{{- $key = $cert.Key }}
{{- $caCrt = $ca.Cert }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ow.labels" (list . "database") | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | b64enc }}
  tls.key: {{ $key | b64enc }}
  ca.crt: {{ $caCrt | b64enc }}
---
{{- end }}

{{- /* Secret values of the api (files of the projected volume, see ow.api.secretFiles) */}}
{{- if .Values.api.enabled }}
{{- $api := .Values.api }}
{{- $apiSecret := include "ow.name" (list . "api") }}
{{- $keys := include "ow.api.chartSecretKeys" . | fromJsonArray }}
{{- if $keys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $apiSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ow.labels" (list . "api") | nindent 4 }}
type: Opaque
data:
  {{- if has "api-secret-key" $keys }}
  api-secret-key: {{ include "ow.secretValue" (list . $api.apiSecretKey $apiSecret "api-secret-key" 32) | b64enc }}
  {{- end }}
  {{- if has "smtp-password" $keys }}
  smtp-password: {{ $api.smtp.password | b64enc }}
  {{- end }}
  {{- if has "twilio-account-sid" $keys }}
  twilio-account-sid: {{ $api.twilio.accountSid | b64enc }}
  twilio-auth-token: {{ required "api.twilio.authToken is required with api.twilio.accountSid" $api.twilio.authToken | b64enc }}
  {{- end }}
---
{{- end }}
{{- end }}

{{- /* The password of the OpenBao user of the wallet (bundled OpenBao,
without openbao.wallet.existingSecret): the value of the earlier release,
else random. The wallet reads it; bootstrap.sh gives it to the user. */}}
{{- if and (include "ow.openbao.bundled" .) (not .Values.openbao.wallet.existingSecret) }}
{{- $walletSecret := include "ow.name" (list . "openbao-wallet") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $walletSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ow.labels" (list . "openbao") | nindent 4 }}
type: Opaque
data:
  password: {{ include "ow.secretValue" (list . "" $walletSecret "password" 32) | b64enc }}
---
{{- end }}

{{- /* The passwords of the read-only database users without their own
Secret (readAccess.<reader>.<owner>.passwordSecret empty): key
<reader>-<owner>, the value of the earlier release, else random. A hook:
the read access hooks of the wallet read it. */}}
{{- $readers := list }}
{{- if .Values.api.enabled }}{{- $readers = append $readers (list "api" "wallet") }}{{- end }}
{{- if .Values.consent.enabled }}{{- $readers = concat $readers (list (list "consent" "api") (list "consent" "wallet")) }}{{- end }}
{{- if .Values.organisationWallet.enabled }}{{- $readers = concat $readers (list (list "wallet" "api") (list "wallet" "consent")) }}{{- end }}
{{- $readAccessSecret := include "ow.readAccess.secretName" . }}
{{- $readAccessKeys := list }}
{{- range $pair := $readers }}
{{- $entry := index (index $.Values.readAccess (index $pair 0) | default dict) (index $pair 1) | default dict }}
{{- if not $entry.passwordSecret }}
{{- $readAccessKeys = append $readAccessKeys (printf "%s-%s" (index $pair 0) (index $pair 1)) }}
{{- end }}
{{- end }}
{{- if $readAccessKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $readAccessSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
  labels:
    {{- include "ow.labels" (list . "read-access") | nindent 4 }}
type: Opaque
data:
  {{- range $key := $readAccessKeys }}
  {{ $key }}: {{ include "ow.secretValue" (list $ "" $readAccessSecret $key 32) | b64enc }}
  {{- end }}
---
{{- end }}

{{- /* The passwords of the database roles of the wallet (the role Secret;
key: the role name without the prefix, ow.wallet.databaseLogins): the value
of the earlier release, else random. The roles hook gives them to the roles;
the migration hook and the wallet pods each mount the key of their role.
A hook (see the text at the top): the roles and migration hooks need the
Secret. */}}
{{- if .Values.organisationWallet.enabled }}
{{- $rolesSecret := include "ow.wallet.databaseRolesSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $rolesSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/resource-policy: keep
  labels:
    {{- include "ow.labels" (list . "wallet-database-roles") | nindent 4 }}
type: Opaque
data:
  {{- range $role := include "ow.wallet.databaseLogins" . | splitList "," }}
  {{ $role }}: {{ include "ow.secretValue" (list $ "" $rolesSecret $role 32) | b64enc }}
  {{- end }}
---
{{- end }}

{{- /* TLS of the chart OpenBao: a CA and a server certificate for the
Service, the pod names and 127.0.0.1 (kept across upgrades). The wallet and
the raft peers trust ca.crt. */}}
{{- if and (include "ow.openbao.bundled" .) (not .Values.openbao.tls.existingSecret) }}
{{- $tlsSecret := include "ow.openbao.tlsSecretName" . }}
{{- $crt := include "ow.lookupSecretKey" (list . $tlsSecret "tls.crt") }}
{{- $key := include "ow.lookupSecretKey" (list . $tlsSecret "tls.key") }}
{{- $caCrt := include "ow.lookupSecretKey" (list . $tlsSecret "ca.crt") }}
{{- if not (and $crt $key $caCrt) }}
{{- $service := include "ow.openbao.name" . }}
{{- $headless := include "ow.openbao.headlessName" . }}
{{- $ns := .Release.Namespace }}
{{- $names := list "localhost" }}
{{- range $host := list $service (printf "*.%s" $headless) }}
{{- $names = concat $names (list $host (printf "%s.%s" $host $ns) (printf "%s.%s.svc" $host $ns) (printf "%s.%s.svc.cluster.local" $host $ns)) }}
{{- end }}
{{- $ca := genCA (printf "%s-ca" $service) 3650 }}
{{- $cert := genSignedCert $service (list "127.0.0.1") $names 3650 $ca }}
{{- $crt = printf "%s%s" $cert.Cert $ca.Cert }}
{{- $key = $cert.Key }}
{{- $caCrt = $ca.Cert }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ow.labels" (list . "openbao") | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | b64enc }}
  tls.key: {{ $key | b64enc }}
  ca.crt: {{ $caCrt | b64enc }}
---
{{- end }}

{{- /* TLS of the bundled NATS: a CA and a certificate for the client
Service, the pod names (the routes) and 127.0.0.1, kept across upgrades. The
servers use it for the clients and, with the client use, for the mutual TLS
of the routes; the processes trust ca.crt. */}}
{{- if and .Values.nats.enabled (not .Values.nats.tls.existingSecret) }}
{{- $tlsSecret := include "ow.nats.tlsSecretName" . }}
{{- $crt := include "ow.lookupSecretKey" (list . $tlsSecret "tls.crt") }}
{{- $key := include "ow.lookupSecretKey" (list . $tlsSecret "tls.key") }}
{{- $caCrt := include "ow.lookupSecretKey" (list . $tlsSecret "ca.crt") }}
{{- if not (and $crt $key $caCrt) }}
{{- $name := include "ow.name" (list . "nats") }}
{{- $ns := .Release.Namespace }}
{{- $names := list "localhost" }}
{{- range $host := list $name (printf "*.%s-headless" $name) }}
{{- $names = concat $names (list $host (printf "%s.%s" $host $ns) (printf "%s.%s.svc" $host $ns) (printf "%s.%s.svc.cluster.local" $host $ns)) }}
{{- end }}
{{- $ca := genCA (printf "%s-ca" $name) 3650 }}
{{- $cert := genSignedCert $name (list "127.0.0.1") $names 3650 $ca }}
{{- $crt = printf "%s%s" $cert.Cert $ca.Cert }}
{{- $key = $cert.Key }}
{{- $caCrt = $ca.Cert }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ow.labels" (list . "nats") | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | b64enc }}
  tls.key: {{ $key | b64enc }}
  ca.crt: {{ $caCrt | b64enc }}
---
{{- end }}

{{- /* The passwords of the ACL users of the bundled Valkey: the users of the
processes without their own Secret (redis.users.<key>.passwordSecret empty;
key: the values key) and the users replication, sentinel and probe of the
Valkey pods. The value of the earlier release, else random. The Valkey pods
put the SHA-256 of each password in their ACL files; each process mounts
the key of its own user. */}}
{{- if include "ow.redis.bundled" . }}
{{- $usersSecret := include "ow.redis.usersSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $usersSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ow.labels" (list . "redis") | nindent 4 }}
type: Opaque
data:
  {{- range $key := include "ow.redis.processUsers" . | splitList "," }}
  {{- if not (index $.Values.redis.users $key).passwordSecret }}
  {{ $key }}: {{ include "ow.secretValue" (list $ "" $usersSecret $key 32) | b64enc }}
  {{- end }}
  {{- end }}
  {{- range $key := list "replication" "sentinel" "probe" }}
  {{ $key }}: {{ include "ow.secretValue" (list $ "" $usersSecret $key 32) | b64enc }}
  {{- end }}
---
{{- end }}

{{- /* TLS of the bundled Valkey: a CA and a server certificate for the pod
names, the Service of the Sentinels and 127.0.0.1 (the probes), kept across
upgrades. The servers use it also as the client certificate of the
replication and of the Sentinel links. The processes trust ca.crt. */}}
{{- if and (include "ow.redis.bundled" .) (not .Values.redis.tls.existingSecret) }}
{{- $tlsSecret := include "ow.redis.tlsSecretName" . }}
{{- $crt := include "ow.lookupSecretKey" (list . $tlsSecret "tls.crt") }}
{{- $key := include "ow.lookupSecretKey" (list . $tlsSecret "tls.key") }}
{{- $caCrt := include "ow.lookupSecretKey" (list . $tlsSecret "ca.crt") }}
{{- if not (and $crt $key $caCrt) }}
{{- $name := include "ow.redis.name" . }}
{{- $ns := .Release.Namespace }}
{{- $names := list "localhost" }}
{{- range $host := list (include "ow.redis.sentinelName" .) (printf "*.%s" (include "ow.redis.headlessName" .)) }}
{{- $names = concat $names (list $host (printf "%s.%s" $host $ns) (printf "%s.%s.svc" $host $ns) (printf "%s.%s.svc.cluster.local" $host $ns)) }}
{{- end }}
{{- $ca := genCA (printf "%s-ca" $name) 3650 }}
{{- $cert := genSignedCert $name (list "127.0.0.1") $names 3650 $ca }}
{{- $crt = printf "%s%s" $cert.Cert $ca.Cert }}
{{- $key = $cert.Key }}
{{- $caCrt = $ca.Cert }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tlsSecret }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "ow.labels" (list . "redis") | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt | b64enc }}
  tls.key: {{ $key | b64enc }}
  ca.crt: {{ $caCrt | b64enc }}
---
{{- end }}
