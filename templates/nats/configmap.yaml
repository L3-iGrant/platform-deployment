{{- if .Values.nats.enabled }}
{{- $nats := .Values.nats }}
{{- $name := include "ow.name" (list . "nats") }}
{{- /* NATS 2.15 and later send JetStream acks on v2-format subjects by
default, but the user permissions ($JS.ACK.<stream>.<consumer>.>) use the
v1 format, so the acks would fail. A tag without a version (a digest or a
custom tag) is not checked. */}}
{{- $version := regexFind "^[0-9]+\\.[0-9]+" (toString $nats.image.tag) }}
{{- if $version }}
{{- $major := index (splitList "." $version) 0 | int }}
{{- $minor := index (splitList "." $version) 1 | int }}
{{- if or (gt $major 2) (and (eq $major 2) (ge $minor 15)) }}
{{- fail (printf "nats.image.tag %s: NATS 2.15 and later send the JetStream acks on subjects of the format v2, and the NATS users of the chart allow the acks only in the format v1 ($JS.ACK.<stream>.<consumer>.>): the consumers of the services could not ack. Use NATS 2.14 (docs/nats-users.md, \"The version of NATS\")" $nats.image.tag) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "nats") | nindent 4 }}
data:
  nats.conf: |
    port: 4222
    http_port: 8222
    server_name: $SERVER_NAME
    pid_file: "/var/run/nats/nats.pid"
    lame_duck_duration: "30s"
    lame_duck_grace_period: "10s"
    max_payload: {{ .Values.nats.maxPayload }}
    # TLS for clients (each process verifies the server with ca.crt).
    tls {
      cert_file: "/etc/nats-tls/tls.crt"
      key_file: "/etc/nats-tls/tls.key"
      ca_file: "/etc/nats-tls/ca.crt"
      timeout: 5
    }
    jetstream {
      store_dir: "/data"
      max_file_store: {{ $nats.jetstream.maxFileStore }}
      max_memory_store: {{ $nats.jetstream.maxMemoryStore }}
    }
    {{- if gt (int $nats.replicas) 1 }}
    cluster {
      name: {{ $name }}
      port: 6222
      no_advertise: true
      # Mutual TLS on the routes: a server only accepts a route with a
      # certificate from the chart's CA (verify), and the route checks the
      # server name.
      tls {
        cert_file: "/etc/nats-tls/tls.crt"
        key_file: "/etc/nats-tls/tls.key"
        ca_file: "/etc/nats-tls/ca.crt"
        verify: true
        timeout: 5
      }
      routes: [
        {{- range $i := until (int $nats.replicas) }}
        nats://{{ $name }}-{{ $i }}.{{ $name }}-headless:6222
        {{- end }}
      ]
    }
    {{- end }}
    {{- include "ow.nats.authorization" . | nindent 4 }}
{{- end }}
{{- if not .Values.nats.enabled }}
{{- /*
External NATS (nats.external.url): the chart does not run the server, so it
renders the authorization block for the operator to add to the server
config (nats.conf) of your NATS.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ow.name" (list . "nats-authorization") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "nats") | nindent 4 }}
data:
  authorization.conf: |
    # Add these lines to your NATS server config (global account). See
    # docs/nats-users.md.
    max_payload: {{ .Values.nats.maxPayload }}
    {{- include "ow.nats.authorization" . | nindent 4 }}
{{- end }}
