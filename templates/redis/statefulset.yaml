{{- if include "ow.redis.bundled" . }}
{{- $r := .Values.redis }}
{{- $name := include "ow.redis.name" . }}
{{- $users := list }}
{{- range $key := include "ow.redis.processUsers" . | splitList "," }}
{{- $users = append $users (merge (dict "path" $key) (include "ow.redis.user" (list $ $key) | fromJson)) }}
{{- end }}
{{- range $user := include "ow.redis.serverUsers" . | splitList "," }}
{{- $users = append $users (dict "path" $user "secret" (include "ow.redis.usersSecretName" $) "key" $user) }}
{{- end }}
{{- $env := list
  (dict "name" "POD_NAME" "valueFrom" (dict "fieldRef" (dict "fieldPath" "metadata.name")))
  (dict "name" "VALKEY_DOMAIN" "value" (include "ow.redis.domain" .))
  (dict "name" "VALKEY_HOSTS" "value" (include "ow.redis.podHosts" . | fromJsonArray | join " "))
  (dict "name" "VALKEY_MASTER_NAME" "value" $r.masterName) }}
{{- $mounts := list
  (dict "name" "config" "mountPath" "/etc/valkey" "readOnly" true)
  (dict "name" "tls" "mountPath" "/etc/valkey-tls" "readOnly" true)
  (dict "name" "users" "mountPath" "/etc/valkey-users" "readOnly" true)
  (dict "name" "run" "mountPath" "/run/valkey")
  (dict "name" "tmp" "mountPath" "/tmp") }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "redis") | nindent 4 }}
spec:
  serviceName: {{ include "ow.redis.headlessName" . }}
  replicas: {{ $r.replicas }}
  # All pods start together. Each pod finds the primary through the group's
  # Sentinels; on the first start of a new group, pod 0 becomes the primary
  # (files/redis/common.sh, find_primary).
  podManagementPolicy: Parallel
  # One pod at a time, from the last pod down to pod 0. The next pod waits
  # until the new pod is ready (an in-sync replica); the primary hands over
  # to a replica before it stops (prestop.sh). redis.affinity can place each
  # pod on its own node (docs/redis.md).
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "ow.selectorLabels" (list . "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ow.labels" (list . "redis") | nindent 8 }}
        {{- include "ow.netpol.labels" (list . "redis" list) | nindent 8 }}
      annotations:
        {{- include "ow.checksum" (list "config" (list (include "ow.redis.serverConfig" .) (include "ow.redis.serverAcl" .) (include "ow.redis.sentinelConfig" .) (.Files.Glob "files/redis/*.sh").AsConfig)) | nindent 8 }}
        {{- include "ow.checksum" (list "secrets" (list $users $r.tls)) | nindent 8 }}
    spec:
      {{- include "ow.podSpecCommon" (list . $r) | nindent 6 }}
      # Valkey does not call the Kubernetes API.
      automountServiceAccountToken: false
      # When the primary stops, it waits up to 30 seconds for the failover
      # (prestop.sh), then the server writes its data.
      terminationGracePeriodSeconds: 60
      containers:
        - name: valkey
          image: {{ include "ow.image" (list . $r.image) }}
          imagePullPolicy: {{ include "ow.imagePullPolicy" (list . $r.image) }}
          command: ["/bin/sh", "/etc/valkey/valkey.sh"]
          env:
            {{- toYaml $env | nindent 12 }}
          ports:
            - name: redis
              containerPort: 6379
          {{- include "ow.containerSecurityContext" (list . $r) | nindent 10 }}
          {{- with $r.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Startup and liveness: the server answers (even while it loads
          # its data). Readiness: the data is loaded, and the server is the
          # primary or an in-sync replica.
          startupProbe:
            exec:
              command: ["/bin/sh", "/etc/valkey/probe.sh", "alive", "6379"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command: ["/bin/sh", "/etc/valkey/probe.sh", "ready"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "/etc/valkey/probe.sh", "alive", "6379"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "/etc/valkey/prestop.sh"]
          volumeMounts:
            {{- toYaml (append $mounts (dict "name" "data" "mountPath" "/data")) | nindent 12 }}
        - name: sentinel
          image: {{ include "ow.image" (list . $r.image) }}
          imagePullPolicy: {{ include "ow.imagePullPolicy" (list . $r.image) }}
          command: ["/bin/sh", "/etc/valkey/sentinel.sh"]
          env:
            {{- toYaml $env | nindent 12 }}
          ports:
            - name: sentinel
              containerPort: 26379
          {{- include "ow.containerSecurityContext" (list . $r) | nindent 10 }}
          {{- with $r.sentinel.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          startupProbe:
            exec:
              command: ["/bin/sh", "/etc/valkey/probe.sh", "alive", "26379"]
            periodSeconds: 5
            timeoutSeconds: 5
            # The Sentinel waits up to 120 seconds for the primary's DNS
            # name.
            failureThreshold: 36
          readinessProbe:
            exec:
              command: ["/bin/sh", "/etc/valkey/probe.sh", "alive", "26379"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "/etc/valkey/probe.sh", "alive", "26379"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            {{- toYaml $mounts | nindent 12 }}
        {{- if $r.metrics.enabled }}
        # Prometheus exporter for the pod's data server (redis.metrics). It
        # logs in as the ACL user metrics, over TLS to 127.0.0.1 (a name in
        # the certificate).
        - name: metrics
          image: {{ include "ow.image" (list . $r.metrics.image) }}
          imagePullPolicy: {{ include "ow.imagePullPolicy" (list . $r.metrics.image) }}
          args:
            - --redis.addr=rediss://127.0.0.1:6379
            - --redis.user=metrics
            - --tls-ca-cert-file=/etc/valkey-metrics/ca.crt
            - --web.listen-address=:9121
            # No CONFIG GET: the metrics user cannot read the config.
            - --config-command=-
          env:
            # The exporter only reads a password from an environment
            # variable or a JSON file.
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "ow.redis.usersSecretName" . }}
                  key: metrics
          ports:
            - name: metrics
              containerPort: 9121
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          {{- include "ow.containerSecurityContext" (list . $r) | nindent 10 }}
          {{- with $r.metrics.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: metrics-ca
              mountPath: /etc/valkey-metrics
              readOnly: true
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: tls
          secret:
            secretName: {{ include "ow.redis.tlsSecretName" . }}
            defaultMode: 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
              - key: ca.crt
                path: ca.crt
        {{- if $r.metrics.enabled }}
        # Only the CA from the TLS Secret, for the exporter.
        - name: metrics-ca
          secret:
            secretName: {{ include "ow.redis.tlsSecretName" . }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
        # One password file per ACL user (the file name is the user key in
        # the templates: {password:<key>}, {hash:<key>}).
        - name: users
          projected:
            defaultMode: 0440
            sources:
              {{- range $user := $users }}
              - secret:
                  name: {{ $user.secret }}
                  items:
                    - key: {{ $user.key }}
                      path: {{ $user.path }}
              {{- end }}
        # Config files with the passwords, and the Sentinel state: in
        # memory, never on the data volume.
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "ow.storageClass" (list . $r.persistence.storageClass) | nindent 8 }}
        resources:
          requests:
            storage: {{ $r.persistence.size }}
{{- end }}
