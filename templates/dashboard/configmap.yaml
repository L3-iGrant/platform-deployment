{{- if .Values.enterpriseDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ow.name" (list . "dashboard") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ow.labels" (list . "dashboard") | nindent 4 }}
data:
  config.json: |
    {{- include "ow.dashboard.config" . | nindent 4 }}
{{- end }}
