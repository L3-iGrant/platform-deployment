# --- Worker groups
# `organisationWallet.workers.groups` is a map with the group name as key
# (was a list). A value of yours changes one group and keeps the others
# (Helm merges maps but replaces lists); `null` removes a default group.
# The grace period of a group is `shutdownTimeoutSeconds` + 30 (the chart
# calculates it; see [Workers and clock](workers.md)).
- old: organisationWallet.workers.groups
  after: 2026.11.7
  kind: slice
  shape: "a map with the group name as key now, for example {main: {queues: [...], replicas: 2, ...}}; without terminationGracePeriodSeconds (the chart calculates it)"
  convert: workerGroups

# --- Client address
# Each public host has its own client address rule, in its exposure block:
# `api.exposure.clientAddress` (the gateway, the api and the webhook
# handler) and `organisationWallet.exposure.clientAddress` (the service
# pods of the wallet), because the hosts can be behind different proxies,
# for example a CDN only in front of the api host. The wallet reads the
# client address with the same rules as the gateway now: it no longer
# trusts `X-Forwarded-For` from a list of proxy networks. Behind
# ingress-nginx or the Envoy Gateway policy of the chart, set `header:
# X-Real-IP` for both hosts (the exposure profiles do it). The trusted
# proxies of a CDN go to the api host; give them to the wallet host only
# when the CDN is also in front of it (see [Exposure](exposure.md)). This
# release needs the wallet image of the same release.
- {old: clientAddress.header, after: 2026.11.7, new: [api.exposure.clientAddress.header, organisationWallet.exposure.clientAddress.header]}
- {old: clientAddress.trustedProxies, after: 2026.11.7, new: api.exposure.clientAddress.trustedProxies, note: "also organisationWallet.exposure.clientAddress.trustedProxies only when the same proxies are in front of the wallet host"}
- {old: clientAddress.trustedProxyHeader, after: 2026.11.7, new: api.exposure.clientAddress.trustedProxyHeader, note: "also organisationWallet.exposure.clientAddress.trustedProxyHeader only when the same proxies are in front of the wallet host"}
- {old: organisationWallet.forwardedAllowIps, after: 2026.11.7, removed: "the wallet reads the client address with the rules of the gateway now: set organisationWallet.exposure.clientAddress, for example header X-Real-IP behind ingress-nginx or the Envoy Gateway policy of the chart"}
