# --- NATS
# NATS has `mode: bundled | external`, as the database, OpenBao and
# Redis. The CA of an external NATS is `nats.external.ca`. The users are
# `nats.users.<process>`, with the seed as a Secret reference; the user of
# the webhook handler is `webhook`. `scripts/make-keys.sh` writes the new
# block.
