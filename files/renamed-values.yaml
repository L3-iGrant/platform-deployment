# --- E-mail and SMS of the api
# A secret is never a value: each secret is a reference to a Secret,
# `{existingSecret, key}`. A plain password, account SID or auth token in a
# values file stops the render: make a Secret first. The sender address of
# the e-mails is `api.smtp.from`.
- old: api.smtp.password
  after: 2026.11.7
  kind: string
  shape: "make a Secret with the SMTP password and set api.smtp.password.existingSecret (and api.smtp.password.key; the default key is smtp-password)"
  secret: true
- {old: api.smtp.existingSecret, after: 2026.11.7, new: api.smtp.password.existingSecret}
- {old: api.smtp.passwordKey, after: 2026.11.7, new: api.smtp.password.key}
- {old: api.smtp.adminEmail, after: 2026.11.7, new: api.smtp.from}
- old: api.twilio.accountSid
  after: 2026.11.7
  kind: string
  shape: "make a Secret with the account SID and set api.twilio.accountSid.existingSecret (and .key; the default key is twilio-account-sid)"
  secret: true
- old: api.twilio.authToken
  after: 2026.11.7
  kind: string
  shape: "make a Secret with the auth token and set api.twilio.authToken.existingSecret (and .key; the default key is twilio-auth-token)"
  secret: true
- {old: api.twilio.existingSecret, after: 2026.11.7, new: [api.twilio.accountSid.existingSecret, api.twilio.authToken.existingSecret]}
- {old: api.twilio.accountSidKey, after: 2026.11.7, new: api.twilio.accountSid.key}
- {old: api.twilio.authTokenKey, after: 2026.11.7, new: api.twilio.authToken.key}

# --- Database
# One admin block for both modes (`database.admin`; the bundled server has
# the user `postgres`), one Secret reference for each database password,
# and the CA of an external server in `database.external.ca`. A plain
# password in a values file stops the render. At an upgrade, the chart
# keeps the passwords of its Secret `<fullname>-postgres`. The read-only
# users are in `database.readAccess` (see [Read access](read-access.md)).
- old: database.databases.api.password
  after: 2026.11.7
  kind: string
  removed: "a plain password in a values file is not permitted; the chart keeps the password of its Secret <fullname>-postgres at an upgrade. For a password of your own, make a Secret and set database.databases.api.password.existingSecret"
  secret: kept
- old: database.databases.oidc.password
  after: 2026.11.7
  kind: string
  removed: "a plain password in a values file is not permitted; the chart keeps the password of its Secret <fullname>-postgres at an upgrade. For a password of your own, make a Secret and set database.databases.oidc.password.existingSecret"
  secret: kept
- old: database.databases.wallet.password
  after: 2026.11.7
  kind: string
  removed: "a plain password in a values file is not permitted; the chart keeps the password of its Secret <fullname>-postgres at an upgrade. For a password of your own, make a Secret and set database.databases.wallet.password.existingSecret"
  secret: kept
- old: database.auth.adminPassword
  after: 2026.11.7
  removed: "a plain password in a values file is not permitted; the chart keeps the password of its Secret <fullname>-postgres at an upgrade. For a password of your own, make a Secret and set database.admin.password.existingSecret"
  secret: kept
- old: database.auth.existingSecret
  after: 2026.11.7
  new: [database.databases.api.password.existingSecret, database.databases.oidc.password.existingSecret, database.databases.wallet.password.existingSecret, database.admin.password.existingSecret]
  note: "the key of each database is its name; for the bundled server, the admin password has the key POSTGRES_PASSWORD"
  convert: databaseSecret
