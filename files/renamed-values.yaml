# The values that changed (docs/upgrade.md). An old value in a values file
# stops the render with a message that names the new value
# (templates/_renamed.tpl), and scripts/upgrade-values.py writes the new
# values file from this table. values.schema.json keeps each old path
# (deprecated, any type) for two releases after the change; then remove
# the entry here and in the schema, and the schema refuses the old key.
#
# Each entry: old (the old path), after (the release after which it
# changed), and one of new (the new path, or a list of paths), removed (why
# it is not a value any more) or shape (what to do, for a new shape).
# Optional: kind (the type of the old value when the path stays), values
# (old value: new value), note (more words for the message), convert (a
# conversion of scripts/upgrade-values.py) and secret (true: a plain
# secret; the operator makes a Secret; kept: the chart keeps the value of
# its own Secret).
#
# A line "# --- <title>" starts a group, and the next comment lines are its
# text: tests/upgrade_page.py writes one table of docs/upgrade.md for each
# group.

# --- The keys block
# All key ids, key Secrets and public JWKS are in one block, `keys`, and
# `scripts/make-keys.sh` writes it (see [Keys](keys.md)). The public JWKS
# of all services can come from one ConfigMap of yours. The lifetime and
# the clock skew of the signed NATS messages and of the internal token,
# and the issuer and audiences of the internal token, are constants.
- {old: api.keyStorage.tokenSigning.activeKid, after: 2026.11.7, new: keys.apiTokenSigning.activeKid}
- {old: api.keyStorage.tokenSigning.existingSecret, after: 2026.11.7, new: keys.apiTokenSigning.existingSecret}
- {old: api.keyStorage.tokenSigning.key, after: 2026.11.7, new: keys.apiTokenSigning.key}
- {old: api.keyStorage.tokenHash.existingSecret, after: 2026.11.7, new: keys.apiTokenHash.existingSecret}
- {old: api.keyStorage.tokenHash.key, after: 2026.11.7, new: keys.apiTokenHash.key}
- {old: api.keyStorage.dbWrapping.existingSecret, after: 2026.11.7, new: keys.apiDatabaseWrapping.existingSecret}
- {old: api.keyStorage.dbWrapping.key, after: 2026.11.7, new: keys.apiDatabaseWrapping.key}
- {old: api.existingSecret, after: 2026.11.7, new: keys.apiHmacKey.existingSecret}
- old: api.apiSecretKey
  after: 2026.11.7
  removed: "a plain secret in a values file is not permitted; the chart keeps the key of its Secret <fullname>-api at an upgrade. For a key of your own, make a Secret and set keys.apiHmacKey.existingSecret"
  secret: kept
- {old: api.serviceEnvelope.activeKid, after: 2026.11.7, new: keys.serviceEnvelope.api.activeKid}
- {old: api.serviceEnvelope.signingKey.existingSecret, after: 2026.11.7, new: keys.serviceEnvelope.api.existingSecret}
- {old: api.serviceEnvelope.signingKey.key, after: 2026.11.7, new: keys.serviceEnvelope.api.key}
- {old: api.serviceEnvelope.lifetimeSeconds, after: 2026.11.7, removed: "a constant of the protocol: the chart writes 60 for all services"}
- {old: api.serviceEnvelope.clockSkewSeconds, after: 2026.11.7, removed: "a constant of the protocol: the chart writes 60 for all services"}
- {old: organisationWallet.serviceEnvelope.activeKid, after: 2026.11.7, new: keys.serviceEnvelope.organisationWallet.activeKid}
- {old: organisationWallet.serviceEnvelope.signingKey.existingSecret, after: 2026.11.7, new: keys.serviceEnvelope.organisationWallet.existingSecret}
- {old: organisationWallet.serviceEnvelope.signingKey.key, after: 2026.11.7, new: keys.serviceEnvelope.organisationWallet.key}
- {old: organisationWallet.serviceEnvelope.lifetimeSeconds, after: 2026.11.7, removed: "a constant of the protocol: the chart writes 60 for all services"}
- {old: organisationWallet.serviceEnvelope.clockSkewSeconds, after: 2026.11.7, removed: "a constant of the protocol: the chart writes 60 for all services"}
- {old: organisationWallet.internalAuth.clockSkewSeconds, after: 2026.11.7, removed: "a constant of the protocol: the chart writes 60"}
- {old: gateway.internalToken.activeKid, after: 2026.11.7, new: keys.gatewayInternalToken.activeKid}
- {old: gateway.internalToken.signingKey.existingSecret, after: 2026.11.7, new: keys.gatewayInternalToken.existingSecret}
- {old: gateway.internalToken.signingKey.key, after: 2026.11.7, new: keys.gatewayInternalToken.key}
- {old: gateway.internalToken.issuer, after: 2026.11.7, removed: "the chart writes the constant igrant-gateway"}
- {old: gateway.internalToken.audiences, after: 2026.11.7, removed: "the chart writes the constants igrant-api-core and wallet-config"}
- {old: gateway.publicKeys.gatewayJwks, after: 2026.11.7, new: keys.publicJwks.gatewayInternalToken}
- {old: gateway.publicKeys.tokenVerificationJwks, after: 2026.11.7, new: keys.publicJwks.apiTokenVerification}
- {old: gateway.publicKeys.gatewayJwksKey, after: 2026.11.7, removed: "the key in the ConfigMap is always gateway-jwks.json"}
- {old: gateway.publicKeys.tokenVerificationJwksKey, after: 2026.11.7, removed: "the key in the ConfigMap is always token-verification-jwks.json"}
- {old: gateway.publicKeys.existingConfigMap, after: 2026.11.7, new: keys.publicJwks.existingConfigMap, note: "one ConfigMap with gateway-jwks.json, token-verification-jwks.json, igrant-api.json and eudi-wallet.json", convert: publicJwksConfigMap}
- {old: gateway.publicKeys.existingTokenVerificationConfigMap, after: 2026.11.7, new: keys.publicJwks.existingConfigMap, note: "one ConfigMap with gateway-jwks.json, token-verification-jwks.json, igrant-api.json and eudi-wallet.json", convert: publicJwksConfigMap}
- {old: serviceKeys.existingConfigMap, after: 2026.11.7, new: keys.publicJwks.existingConfigMap, note: "one ConfigMap with gateway-jwks.json, token-verification-jwks.json, igrant-api.json and eudi-wallet.json", convert: publicJwksConfigMap}
- {old: serviceKeys.publicJwks.igrant-api, after: 2026.11.7, new: keys.serviceEnvelope.api.publicJwks}
- {old: serviceKeys.publicJwks.eudi-wallet, after: 2026.11.7, new: keys.serviceEnvelope.organisationWallet.publicJwks}

# --- E-mail and SMS of the api
# A secret is never a value: each secret is a reference to a Secret,
# `{existingSecret, key}`. A plain password, account SID or auth token in a
# values file stops the render: make a Secret first. The sender address of
# the e-mails is `api.smtp.from`.
- old: api.smtp.password
  after: 2026.11.7
  kind: string
  shape: "make a Secret with the SMTP password and set api.smtp.password.existingSecret (and api.smtp.password.key; the default key is smtp-password)"
  secret: true
- {old: api.smtp.existingSecret, after: 2026.11.7, new: api.smtp.password.existingSecret}
- {old: api.smtp.passwordKey, after: 2026.11.7, new: api.smtp.password.key}
- {old: api.smtp.adminEmail, after: 2026.11.7, new: api.smtp.from}
- old: api.twilio.accountSid
  after: 2026.11.7
  kind: string
  shape: "make a Secret with the account SID and set api.twilio.accountSid.existingSecret (and .key; the default key is twilio-account-sid)"
  secret: true
- old: api.twilio.authToken
  after: 2026.11.7
  kind: string
  shape: "make a Secret with the auth token and set api.twilio.authToken.existingSecret (and .key; the default key is twilio-auth-token)"
  secret: true
- {old: api.twilio.existingSecret, after: 2026.11.7, new: [api.twilio.accountSid.existingSecret, api.twilio.authToken.existingSecret]}
- {old: api.twilio.accountSidKey, after: 2026.11.7, new: api.twilio.accountSid.key}
- {old: api.twilio.authTokenKey, after: 2026.11.7, new: api.twilio.authToken.key}
