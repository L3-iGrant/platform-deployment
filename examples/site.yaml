# Your installation: the host names.
# Copy this file and change the values. Use it with one file of each group
# (database, OpenBao, exposure) and the keys file of scripts/make-keys.sh:
#   helm install ows <chart> -n ows -f values-keys.yaml -f site.yaml \
#     -f postgresql-bundled.yaml -f openbao-shamir.yaml -f exposure-ingress-nginx.yaml
global:
  # The release tag of the iGrant.io images (from iGrant.io). "2026.10.x" is
  # a placeholder: no image has this tag.
  imageTag: "2026.10.x"
api:
  # The host of the api (the auth gateway receives every request). On
  # premise it is internal (examples/exposure-on-premise.yaml).
  host: api.example.org
organisationWallet:
  # The public host of the organisation wallet.
  host: wallet.example.org
enterpriseDashboard:
  # The host of the enterprise dashboard (on premise internal). It must
  # have the same registrable domain as the api host (the login cookie).
  host: dashboard.example.org
